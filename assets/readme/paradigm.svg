<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <rect width="1200" height="340" rx="18" fill="#FBFCFE"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#E0E3EB" stroke-width="1"/>

  <text x="40" y="34" font-size="14" font-weight="600" fill="#5B6472">计算范式 · unstructured state in → typed decision out</text>
  <text x="40" y="56" font-size="12.5" fill="#7A8494">Generation 只在两端边缘:写简报 · 向人解释 · 提新解释候选</text>

  <!-- REPRESENT:混乱世界 → 压缩到 state -->
  <g fill="#C4CDDB">
    <rect x="44" y="92" width="15" height="15" rx="2"/>
    <rect x="92" y="78" width="13" height="13" rx="2" fill="#CCD5E2"/>
    <rect x="50" y="150" width="16" height="16" rx="2" fill="#B4C0D2"/>
    <rect x="106" y="142" width="13" height="13" rx="2"/>
    <rect x="56" y="212" width="15" height="15" rx="2" fill="#CCD5E2"/>
    <rect x="116" y="214" width="13" height="13" rx="2" fill="#B4C0D2"/>
    <rect x="150" y="176" width="14" height="14" rx="2"/>
  </g>
  <g stroke="#C4CDDB" stroke-width="1">
    <line x1="59" y1="99" x2="210" y2="178"/>
    <line x1="98" y1="84" x2="210" y2="178"/>
    <line x1="58" y1="158" x2="210" y2="178"/>
    <line x1="112" y1="148" x2="210" y2="178"/>
    <line x1="63" y1="219" x2="210" y2="178"/>
    <line x1="122" y1="220" x2="210" y2="178"/>
    <line x1="157" y1="183" x2="210" y2="178"/>
  </g>
  <rect x="210" y="150" width="120" height="56" rx="10" fill="#EAF0FE" stroke="#2962FF" stroke-width="1.4"/>
  <text x="270" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#1C2430">可比较 state</text>
  <text x="270" y="195" text-anchor="middle" font-size="11.5" fill="#5B6472">point-in-time</text>

  <!-- PROPOSE:扇出候选 -->
  <g stroke="#C2CBD9" stroke-width="1.1">
    <line x1="330" y1="178" x2="460" y2="91"/>
    <line x1="330" y1="178" x2="460" y2="129"/>
    <line x1="330" y1="178" x2="460" y2="167"/>
    <line x1="330" y1="178" x2="460" y2="205"/>
    <line x1="330" y1="178" x2="460" y2="243"/>
  </g>
  <g font-size="11.5" fill="#1C2430">
    <rect x="460" y="78" width="104" height="26" rx="13" fill="#EAF0FE" stroke="#2962FF" stroke-width="1.2"/><text x="512" y="95" text-anchor="middle">E1 本体</text>
    <rect x="460" y="116" width="104" height="26" rx="13" fill="#F1EBFE" stroke="#8B5CF6" stroke-width="1.2"/><text x="512" y="133" text-anchor="middle">E2 供应链</text>
    <rect x="460" y="154" width="104" height="26" rx="13" fill="#E3F4F0" stroke="#089981" stroke-width="1.2"/><text x="512" y="171" text-anchor="middle">E3 需求</text>
    <rect x="460" y="192" width="104" height="26" rx="13" fill="#FDF1DC" stroke="#E0912B" stroke-width="1.2"/><text x="512" y="209" text-anchor="middle">E4 竞对</text>
    <rect x="460" y="230" width="104" height="26" rx="13" fill="#FBE9EA" stroke="#EF5350" stroke-width="1.2"/><text x="512" y="247" text-anchor="middle">E5 主题 · E6…</text>
  </g>

  <!-- PREDICT 标注 -->
  <text x="655" y="86" text-anchor="middle" font-size="12.5" fill="#077568">PREDICT · 指标空间预判(Actual vs Forecast)</text>

  <!-- SELECT:剪枝收敛到单一决策 -->
  <g stroke="#C2CBD9" stroke-width="1.1">
    <line x1="564" y1="91" x2="770" y2="178"/>
    <line x1="564" y1="129" x2="770" y2="178"/>
    <line x1="564" y1="167" x2="770" y2="178"/>
    <line x1="564" y1="205" x2="770" y2="178"/>
    <line x1="564" y1="243" x2="770" y2="178"/>
  </g>
  <rect x="770" y="150" width="140" height="56" rx="10" fill="#FDF1DC" stroke="#E0912B" stroke-width="1.4"/>
  <text x="840" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#1C2430">typed 决策</text>
  <text x="840" y="195" text-anchor="middle" font-size="11.5" fill="#5B6472">+ 置信度</text>

  <text x="945" y="184" text-anchor="middle" font-size="20" fill="#9AA3B2">→</text>

  <!-- ticker 结论 -->
  <rect x="980" y="150" width="160" height="56" rx="10" fill="#EAF0FE" stroke="#2962FF" stroke-width="1.6"/>
  <text x="1060" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#1C2430">ticker 结论 / KPI</text>
  <text x="1060" y="195" text-anchor="middle" font-size="11.5" fill="#5B6472">组合传导 read-through</text>

  <!-- 阶段标签 -->
  <g font-size="12.5" font-weight="600">
    <text x="245" y="300" text-anchor="middle" fill="#2158E0">REPRESENT · 压缩</text>
    <text x="512" y="300" text-anchor="middle" fill="#7C3AED">PROPOSE · 枚举候选</text>
    <text x="720" y="300" text-anchor="middle" fill="#B26A00">PREDICT → SELECT · 剪枝</text>
  </g>

  <!-- 闭环 -->
  <path d="M1060 206 C1060 318 1060 320 1016 320 L314 320 C270 320 270 318 270 206" fill="none" stroke="#9AA3B2" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M270 200 L264 211 L276 211 Z" fill="#9AA3B2"/>
  <rect x="600" y="311" width="150" height="18" fill="#FBFCFE"/>
  <text x="675" y="324" text-anchor="middle" font-size="12.5" fill="#7A8494">outcome → 校准 (RLCD)</text>
</svg>
