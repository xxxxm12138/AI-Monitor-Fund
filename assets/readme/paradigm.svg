<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <rect width="1200" height="340" rx="18" fill="#0E1524"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#1E2A44" stroke-width="1"/>

  <text x="40" y="34" font-size="14" font-weight="600" fill="#8A96AC">计算范式 · unstructured state in → typed decision out</text>
  <text x="40" y="56" font-size="12.5" fill="#5B6B84">Generation 只在两端边缘:写简报 · 向人解释 · 提新解释候选</text>

  <!-- REPRESENT:混乱世界 → 压缩到 state -->
  <g fill="#2E3A57">
    <rect x="44" y="92" width="15" height="15" rx="2"/>
    <rect x="92" y="78" width="13" height="13" rx="2" fill="#39476A"/>
    <rect x="50" y="150" width="16" height="16" rx="2" fill="#33405F"/>
    <rect x="106" y="142" width="13" height="13" rx="2"/>
    <rect x="56" y="212" width="15" height="15" rx="2" fill="#39476A"/>
    <rect x="116" y="214" width="13" height="13" rx="2" fill="#33405F"/>
    <rect x="150" y="176" width="14" height="14" rx="2"/>
  </g>
  <g stroke="#2E3A57" stroke-width="1">
    <line x1="59" y1="99" x2="210" y2="178"/>
    <line x1="98" y1="84" x2="210" y2="178"/>
    <line x1="58" y1="158" x2="210" y2="178"/>
    <line x1="112" y1="148" x2="210" y2="178"/>
    <line x1="63" y1="219" x2="210" y2="178"/>
    <line x1="122" y1="220" x2="210" y2="178"/>
    <line x1="157" y1="183" x2="210" y2="178"/>
  </g>
  <rect x="210" y="150" width="120" height="56" rx="10" fill="#142038" stroke="#2962FF" stroke-width="1.4"/>
  <text x="270" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#E6EAF2">可比较 state</text>
  <text x="270" y="195" text-anchor="middle" font-size="11.5" fill="#8A96AC">point-in-time</text>

  <!-- PROPOSE:扇出候选 -->
  <g stroke="#46527A" stroke-width="1.1">
    <line x1="330" y1="178" x2="460" y2="91"/>
    <line x1="330" y1="178" x2="460" y2="129"/>
    <line x1="330" y1="178" x2="460" y2="167"/>
    <line x1="330" y1="178" x2="460" y2="205"/>
    <line x1="330" y1="178" x2="460" y2="243"/>
  </g>
  <g font-size="11.5" fill="#C7D0E0">
    <rect x="460" y="78" width="104" height="26" rx="13" fill="#101B33" stroke="#2962FF" stroke-width="1.2"/><text x="512" y="95" text-anchor="middle">E1 本体</text>
    <rect x="460" y="116" width="104" height="26" rx="13" fill="#171233" stroke="#8B5CF6" stroke-width="1.2"/><text x="512" y="133" text-anchor="middle">E2 供应链</text>
    <rect x="460" y="154" width="104" height="26" rx="13" fill="#0E241F" stroke="#089981" stroke-width="1.2"/><text x="512" y="171" text-anchor="middle">E3 需求</text>
    <rect x="460" y="192" width="104" height="26" rx="13" fill="#231D0F" stroke="#F5A623" stroke-width="1.2"/><text x="512" y="209" text-anchor="middle">E4 竞对</text>
    <rect x="460" y="230" width="104" height="26" rx="13" fill="#26141A" stroke="#EF5350" stroke-width="1.2"/><text x="512" y="247" text-anchor="middle">E5 主题 · E6…</text>
  </g>

  <!-- PREDICT 标注 -->
  <text x="655" y="86" text-anchor="middle" font-size="12.5" fill="#23C9A7">PREDICT · 指标空间预判(Actual vs Forecast)</text>

  <!-- SELECT:剪枝收敛到单一决策 -->
  <g stroke="#46527A" stroke-width="1.1">
    <line x1="564" y1="91" x2="770" y2="178"/>
    <line x1="564" y1="129" x2="770" y2="178"/>
    <line x1="564" y1="167" x2="770" y2="178"/>
    <line x1="564" y1="205" x2="770" y2="178"/>
    <line x1="564" y1="243" x2="770" y2="178"/>
  </g>
  <rect x="770" y="150" width="140" height="56" rx="10" fill="#2A2412" stroke="#F5A623" stroke-width="1.4"/>
  <text x="840" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#E6EAF2">typed 决策</text>
  <text x="840" y="195" text-anchor="middle" font-size="11.5" fill="#8A96AC">+ 置信度</text>

  <text x="945" y="184" text-anchor="middle" font-size="20" fill="#55617A">→</text>

  <!-- ticker 结论 -->
  <rect x="980" y="150" width="160" height="56" rx="10" fill="#101B33" stroke="#2962FF" stroke-width="1.6"/>
  <text x="1060" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#E6EAF2">ticker 结论 / KPI</text>
  <text x="1060" y="195" text-anchor="middle" font-size="11.5" fill="#8A96AC">组合传导 read-through</text>

  <!-- 阶段标签 -->
  <g font-size="12.5" font-weight="600">
    <text x="245" y="300" text-anchor="middle" fill="#5B8CFF">REPRESENT · 压缩</text>
    <text x="512" y="300" text-anchor="middle" fill="#A98BFF">PROPOSE · 枚举候选</text>
    <text x="720" y="300" text-anchor="middle" fill="#FBC15A">PREDICT → SELECT · 剪枝</text>
  </g>

  <!-- 闭环 -->
  <path d="M1060 206 C1060 318 1060 320 1016 320 L314 320 C270 320 270 318 270 206" fill="none" stroke="#55617A" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M270 200 L264 211 L276 211 Z" fill="#55617A"/>
  <rect x="600" y="311" width="150" height="18" fill="#0E1524"/>
  <text x="675" y="324" text-anchor="middle" font-size="12.5" fill="#7E8AA0">outcome → 校准 (RLCD)</text>
</svg>
