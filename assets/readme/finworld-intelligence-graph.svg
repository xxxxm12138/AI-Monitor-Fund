<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Intelligence Graph 四算子</title><desc id="desc">输入快照扩张为候选，经指标预测与证据筛选后收窄；实际结果回流校准。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#607087"/></marker></defs><rect width="1200" height="640" rx="20" fill="#F6F8FC"/><g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Segoe UI,sans-serif"><text x="48" y="62" fill="#152238" font-size="42" font-weight="650">从扩张解释，到收窄判断</text><text x="48" y="104" fill="#607087" font-size="20" font-weight="400">REPRESENT / PROPOSE / PREDICT / SELECT</text><rect x="48" y="230" width="240" height="100" rx="12" fill="white" stroke="#315BE8" stroke-width="2"/><text x="70" y="266" fill="#315BE8" font-size="22" font-weight="600">01 REPRESENT</text><text x="70" y="300" fill="#152238" font-size="24" font-weight="400">表征 · 输入快照</text><rect x="388" y="148" width="300" height="100" rx="12" fill="white" stroke="#315BE8" stroke-width="2"/><text x="410" y="184" fill="#315BE8" font-size="22" font-weight="600">02 PROPOSE</text><text x="410" y="218" fill="#152238" font-size="24" font-weight="400">候选 A · 供给约束</text><path d="M288 280 L338 280 L338 198 L388 198" fill="none" stroke="#607087" stroke-width="2"  marker-end="url(#arrow)"/><rect x="388" y="280" width="300" height="100" rx="12" fill="white" stroke="#315BE8" stroke-width="2"/><text x="410" y="316" fill="#315BE8" font-size="22" font-weight="600">02 PROPOSE</text><text x="410" y="350" fill="#152238" font-size="24" font-weight="400">候选 B · 时间差</text><path d="M288 280 L338 280 L338 330 L388 330" fill="none" stroke="#607087" stroke-width="2"  marker-end="url(#arrow)"/><rect x="388" y="412" width="300" height="100" rx="12" fill="white" stroke="#315BE8" stroke-width="2"/><text x="410" y="448" fill="#315BE8" font-size="22" font-weight="600">02 PROPOSE</text><text x="410" y="482" fill="#152238" font-size="24" font-weight="400">候选 C · 需求增量</text><path d="M288 280 L338 280 L338 462 L388 462" fill="none" stroke="#607087" stroke-width="2"  marker-end="url(#arrow)"/><rect x="790" y="230" width="360" height="100" rx="12" fill="white" stroke="#008577" stroke-width="2"/><text x="812" y="266" fill="#008577" font-size="22" font-weight="600">03 PREDICT</text><text x="812" y="300" fill="#152238" font-size="24" font-weight="400">指标 · 期间 · 证伪条件</text><rect x="790" y="412" width="360" height="100" rx="12" fill="white" stroke="#008577" stroke-width="2"/><text x="812" y="448" fill="#008577" font-size="22" font-weight="600">04 SELECT</text><text x="812" y="482" fill="#152238" font-size="24" font-weight="400">保留 / 待补 / 排除</text><path d="M688 198 L736 198 L736 280 L790 280" fill="none" stroke="#607087" stroke-width="2"  marker-end="url(#arrow)"/><path d="M688 330 L736 330 L736 280 L790 280" fill="none" stroke="#607087" stroke-width="2"  marker-end="url(#arrow)"/><path d="M688 462 L736 462 L736 280 L790 280" fill="none" stroke="#607087" stroke-width="2"  marker-end="url(#arrow)"/><path d="M970 330 L970 412" fill="none" stroke="#607087" stroke-width="2"  marker-end="url(#arrow)"/><path d="M970 512 L970 588 L168 588 L168 330" fill="none" stroke="#607087" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="360" y="577" fill="#607087" font-size="22" font-weight="400">实际结果 → 误差归因 → 再表征</text></g></svg>