<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
<rect x="0" y="0" width="1440" height="960" rx="0" fill="#f4f6fa"/>
<rect x="20" y="20" width="1400" height="810" rx="16" fill="#fff" stroke="#dfe5ee"/>
<rect x="20" y="20" width="220" height="810" rx="16" fill="#142238"/>
<text x="43" y="65" font-size="29" fill="#fff" font-weight="700">FinWorld</text>
<text x="43" y="91" font-size="11" fill="#a7bbd6" font-weight="600">RESEARCH WORKBENCH</text>
<text x="53" y="150" font-size="18" fill="#a9bad2" font-weight="400">任务总览</text>
<text x="53" y="208" font-size="18" fill="#a9bad2" font-weight="400">证据与逻辑树</text>
<rect x="34" y="238" width="192" height="44" rx="8" fill="#2b4770"/>
<text x="53" y="266" font-size="18" fill="#fff" font-weight="600">情景与估值</text>
<text x="53" y="324" font-size="18" fill="#a9bad2" font-weight="400">判断与评测</text>
<text x="44" y="719" font-size="15" fill="#a9bad2" font-weight="400">项目：示例公司 A</text>
<text x="44" y="748" font-size="15" fill="#a9bad2" font-weight="400">业务：NOR / MCU</text>
<text x="44" y="788" font-size="12" fill="#83a6d5" font-weight="600">DESIGN PREVIEW</text>
<text x="272" y="64" font-size="28" fill="#152238" font-weight="700">情景分析与判断记录</text>
<text x="272" y="96" font-size="16" fill="#66768c" font-weight="400">公司 A / NOR · 假设型演算，展示经营变量如何进入财务结果。</text>
<rect x="1160" y="44" width="225" height="30" rx="6" fill="#edf3ff"/>
<text x="1172" y="65" font-size="14" fill="#2860dc" font-weight="600">界面设计示意</text>
<path d="M260 119 L1400 119" stroke="#e5eaf2" fill="none" stroke-width="2"/>
<text x="38" y="872" font-size="19" fill="#244a87" font-weight="700">读图说明</text>
<rect x="272" y="141" width="285" height="30" rx="6" fill="#edf3ff"/>
<text x="284" y="162" font-size="14" fill="#2860dc" font-weight="600">规划功能 · 非运行截图</text>
<rect x="272" y="188" width="400" height="426" rx="10" fill="#f6f8fc"/>
<text x="294" y="230" font-size="22" fill="#25324a" font-weight="700">① 输入假设</text>
<text x="294" y="278" font-size="17" fill="#25324a" font-weight="400">基准销量 Q</text>
<text x="510" y="278" font-size="18" fill="#2860dc" font-weight="600">100 万颗</text>
<text x="294" y="333" font-size="17" fill="#25324a" font-weight="400">基准售价 P</text>
<text x="510" y="333" font-size="18" fill="#2860dc" font-weight="600">10 元 / 颗</text>
<text x="294" y="388" font-size="17" fill="#25324a" font-weight="400">单位营业成本 C</text>
<text x="510" y="388" font-size="18" fill="#2860dc" font-weight="600">7 元 / 颗</text>
<text x="294" y="443" font-size="17" fill="#25324a" font-weight="400">上行情景：售价</text>
<text x="510" y="443" font-size="18" fill="#2860dc" font-weight="600">+10%</text>
<text x="294" y="498" font-size="17" fill="#25324a" font-weight="400">下行情景：销量</text>
<text x="510" y="498" font-size="18" fill="#2860dc" font-weight="600">−10%</text>
<text x="294" y="582" font-size="16" fill="#728097" font-weight="400">未列参数保持不变；不含费用与税。</text>
<rect x="696" y="188" width="687" height="426" rx="10" fill="#f6f8fc"/>
<text x="718" y="230" font-size="22" fill="#25324a" font-weight="700">② 情景结果</text>
<text x="718" y="279" font-size="17" fill="#728097" font-weight="400">情景</text>
<text x="898" y="279" font-size="17" fill="#728097" font-weight="400">收入 / 万元</text>
<text x="1132" y="279" font-size="17" fill="#728097" font-weight="400">毛利 / 万元</text>
<text x="718" y="334" font-size="21" fill="#25324a" font-weight="600">基准</text>
<text x="898" y="334" font-size="21" fill="#25324a" font-weight="600">1,000</text>
<text x="1132" y="334" font-size="21" fill="#25324a" font-weight="600">300</text>
<path d="M718 356 L1355 356" stroke="#e5eaf2" fill="none" stroke-width="2"/>
<text x="718" y="401" font-size="21" fill="#2860dc" font-weight="600">售价 +10%</text>
<text x="898" y="401" font-size="21" fill="#2860dc" font-weight="600">1,100</text>
<text x="1132" y="401" font-size="21" fill="#2860dc" font-weight="600">400</text>
<path d="M718 423 L1355 423" stroke="#e5eaf2" fill="none" stroke-width="2"/>
<text x="718" y="468" font-size="21" fill="#25324a" font-weight="600">销量 −10%</text>
<text x="898" y="468" font-size="21" fill="#25324a" font-weight="600">900</text>
<text x="1132" y="468" font-size="21" fill="#25324a" font-weight="600">270</text>
<path d="M718 490 L1355 490" stroke="#e5eaf2" fill="none" stroke-width="2"/>
<text x="718" y="548" font-size="21" fill="#008b78" font-weight="600">毛利 = Q × (P − C)</text>
<text x="718" y="582" font-size="16" fill="#728097" font-weight="400">价格兑现、需求反馈与成本变化须另设情景。</text>
<rect x="272" y="638" width="1111" height="164" rx="10" fill="#edf3ff"/>
<text x="294" y="677" font-size="21" fill="#25324a" font-weight="700">③ 保存判断：为何选择这一情景？</text>
<text x="294" y="717" font-size="17" fill="#25324a" font-weight="400">候选：涨价兑现 / 部分兑现 / 需求回落     选择：待研究员确认     置信度：待定</text>
<text x="294" y="754" font-size="17" fill="#25324a" font-weight="400">验证条件：实际成交 ASP、出货量、销售成本     结果回填：下一期披露后</text>
<text x="294" y="785" font-size="15" fill="#617187" font-weight="400">估值扩展：先补费用、税、现金流与股本，再选择估值方法和参数。</text>
<text x="160" y="872" font-size="17" fill="#4b5b72" font-weight="400">① 显式保存假设与单位。② 用同一财务关系比较情景。③ 记录选择依据，并等待结果验证。</text>
<text x="160" y="900" font-size="17" fill="#4b5b72" font-weight="400">图中数字为虚构算例，算术可复核；不对应真实公司数据、估值或投资建议。</text>
</svg>