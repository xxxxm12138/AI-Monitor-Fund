<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa0a8"/></marker>
<marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b3271e"/></marker>
</defs>
<rect x="0" y="0" width="720" height="590" fill="#ffffff"/>
<text x="24" y="32" fill="#1f2329" font-size="16" font-weight="700">NBIS：6 条理由，卡在上电</text>
<text x="24" y="52" fill="#8a9099" font-size="11.5">少一条理由没关系；上电没发生，供给那几条一起没</text>

<text x="24" y="84" fill="#1a7f45" font-size="13.5" font-weight="700">6 条独立理由</text>
<text x="24" y="102" fill="#8a9099" font-size="11">供给几条都建立在「机房已经通电」上</text>

<g>
<rect x="24" y="122" width="168" height="36" rx="7" fill="#eef1fb" stroke="#c9d2f0"/><rect x="24" y="122" width="4" height="36" fill="#2f4bb3"/><text x="38" y="145" fill="#2f4bb3" font-size="12" font-weight="600">供给 · 光 / GPU / capex</text>
<rect x="24" y="168" width="168" height="36" rx="7" fill="#e3f4e9" stroke="#bfe3cc"/><rect x="24" y="168" width="4" height="36" fill="#1a7f45"/><text x="38" y="191" fill="#1a7f45" font-size="12" font-weight="600">需求 · lab 融资 / token</text>
<rect x="24" y="214" width="168" height="36" rx="7" fill="#efeafc" stroke="#ddd3f3"/><rect x="24" y="214" width="4" height="36" fill="#6b4bc4"/><text x="38" y="237" fill="#6b4bc4" font-size="12" font-weight="600">能力 · 训练 / AA / bench</text>
<rect x="24" y="260" width="168" height="36" rx="7" fill="#e0f0f2" stroke="#bfe0e4"/><rect x="24" y="260" width="4" height="36" fill="#0e7490"/><text x="38" y="283" fill="#0e7490" font-size="12" font-weight="600">变现 · 推理弹性 / cost</text>
<rect x="24" y="306" width="168" height="36" rx="7" fill="#fbf0dd" stroke="#efdcae"/><rect x="24" y="306" width="4" height="36" fill="#b5730c"/><text x="38" y="329" fill="#b5730c" font-size="12" font-weight="600">政体 · 出口 / 循环融资</text>
<rect x="24" y="352" width="168" height="36" rx="7" fill="#f3f4f6" stroke="#e0e3e7"/><rect x="24" y="352" width="4" height="36" fill="#8a9099"/><text x="38" y="375" fill="#8a9099" font-size="12" font-weight="600">本体 · backlog / 上电</text>
</g>

<g>
<rect x="268" y="122" width="168" height="36" rx="7" fill="#fbeaea" stroke="#e6a9a9" stroke-width="1.6"/><text x="280" y="138" fill="#b3271e" font-size="11.5">neocloud 上电 / 在建</text><text x="280" y="152" fill="#b3271e" font-size="11" font-weight="700">没通电则后面都白做</text>
<rect x="268" y="168" width="168" height="36" rx="7" fill="#fbfbfd" stroke="#dfe3e8"/><text x="280" y="191" fill="#454b52" font-size="11.5">lab 算力采购力</text>
<rect x="268" y="214" width="168" height="36" rx="7" fill="#fbfbfd" stroke="#dfe3e8"/><text x="280" y="237" fill="#454b52" font-size="11.5">推理 / 训练需求</text>
<rect x="268" y="260" width="168" height="36" rx="7" fill="#fbfbfd" stroke="#dfe3e8"/><text x="280" y="283" fill="#454b52" font-size="11.5">推理需求弹性</text>
</g>

<defs>
<marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa0a8"/></marker>
<marker id="ahr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b3271e"/></marker>
