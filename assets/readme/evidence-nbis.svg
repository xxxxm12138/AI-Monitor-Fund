<path d="M192,324 C400,338 500,276 546,266" fill="none" stroke="#c3c8ce" stroke-width="1.7" marker-end="url(#ah2)"/>
<path d="M192,370 C400,390 510,290 546,272" fill="none" stroke="#c3c8ce" stroke-width="1.7" marker-end="url(#ah2)"/>

<line x1="24" y1="414" x2="696" y2="414" stroke="#e6e8eb"/>
<text x="24" y="438" fill="#1f2329" font-size="12" font-weight="700">怎么读</text>
<text x="24" y="458" fill="#454b52" font-size="12">左边每一条都是一条独立证据。少一条，另外几条还能撑「持有 NBIS」。</text>
<text x="24" y="478" fill="#454b52" font-size="12">光模块 / GPU / capex 都要先看机房有没有上电。没上电，这几条同时作废。</text>
<text x="24" y="498" fill="#454b52" font-size="12">所以日常最盯红框：上电。黑块是持仓本身。</text>

<rect x="24" y="528" width="26" height="3" fill="#b3271e"/>
<text x="58" y="534" fill="#454b52" font-size="11">红线 = 必须经过上电</text>
<rect x="184" y="522" width="16" height="16" rx="4" fill="#fbeaea" stroke="#e6a9a9"/>
<text x="208" y="534" fill="#454b52" font-size="11">浅红框 = 上电（最该盯）</text>
<rect x="330" y="522" width="16" height="16" rx="4" fill="#1f2329"/>
<text x="354" y="534" fill="#454b52" font-size="11">黑块 = NBIS</text>
</svg>
