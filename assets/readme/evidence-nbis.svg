<line x1="192" y1="278" x2="266" y2="278" stroke="#c3c8ce" stroke-width="1.7" marker-end="url(#ah2)"/>

<rect x="548" y="214" width="144" height="72" rx="10" fill="#1f2329"/>
<text x="620" y="244" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">L2 · 51.2%</text>
<text x="620" y="268" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">NBIS</text>

<path d="M436,140 C490,140 520,228 546,244" fill="none" stroke="#b3271e" stroke-width="2.1" marker-end="url(#ahr2)"/>
<path d="M436,186 C490,186 520,236 546,248" fill="none" stroke="#c3c8ce" stroke-width="1.7" marker-end="url(#ah2)"/>
