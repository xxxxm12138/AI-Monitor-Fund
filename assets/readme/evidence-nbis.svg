<text x="24" y="480" fill="#1f2329" font-size="12" font-weight="700">怎么读</text>
<text x="24" y="502" fill="#454b52" font-size="12">红框「集群在建」进了 3 条线：这才是图上的最小割（拆这一个点，三条供给同时断）。</text>
<text x="24" y="522" fill="#454b52" font-size="12">「上电」只进 1 条线，那是 NBIS 自己的产能读数，不是三条供给的汇合点。</text>
<text x="24" y="542" fill="#454b52" font-size="12">backlog 绕过中间机制直连。GPU 走供给成本，也不经过上电。</text>
<text x="24" y="562" fill="#454b52" font-size="12">没通电变不成收入 = 业务判断，不要画成「光模块边经过上电」。</text>

