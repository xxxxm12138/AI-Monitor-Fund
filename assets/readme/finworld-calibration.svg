<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc"><title id="title">研究与执行分工的双层校准</title><desc id="desc">内层修正判断，外层评估执行者；人工、旁跑、辅助、自动逐步验证，并保留回退。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#607087"/></marker></defs><rect width="1200" height="490" rx="20" fill="#F6F8FC"/><g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Segoe UI,sans-serif"><text x="48" y="62" fill="#152238" font-size="42" font-weight="650">判断会校准，分工也会演进</text><text x="48" y="104" fill="#607087" font-size="22" font-weight="400">同一输入快照 · 独立留痕 · 结果兑现后比较</text><rect x="48" y="164" width="316" height="100" rx="12" fill="white" stroke="#315BE8" stroke-width="2"/><text x="70" y="200" fill="#315BE8" font-size="22" font-weight="600">研究轨迹</text><text x="70" y="234" fill="#152238" font-size="24" font-weight="400">状态 / 候选 / 判断</text><rect x="442" y="164" width="316" height="100" rx="12" fill="white" stroke="#315BE8" stroke-width="2"/><text x="464" y="200" fill="#315BE8" font-size="22" font-weight="600">内层 · 改进判断</text><text x="464" y="234" fill="#152238" font-size="24" font-weight="400">归因 / 修正 / 复验</text><path d="M364 214 L442 214" fill="none" stroke="#607087" stroke-width="2"  marker-end="url(#arrow)"/><rect x="836" y="164" width="316" height="100" rx="12" fill="white" stroke="#008577" stroke-width="2"/><text x="858" y="200" fill="#008577" font-size="22" font-weight="600">外层 · 调整分工</text><text x="858" y="234" fill="#152238" font-size="24" font-weight="400">质量 / 校准 / 成本</text><path d="M758 214 L836 214" fill="none" stroke="#607087" stroke-width="2"  marker-end="url(#arrow)"/><path d="M600 264 L600 320 L206 320 L206 264" fill="none" stroke="#607087" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="48" y="396" fill="#008577" font-size="30" font-weight="600">HUMAN → SHADOW → ASSISTED → AUTO</text><text x="48" y="441" fill="#607087" font-size="24" font-weight="400">升级须有验证；漂移或失败时回退。自动分流与持续评测待接入。</text></g></svg>