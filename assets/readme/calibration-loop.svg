<svg viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
<marker id="ab" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a9099"/></marker>
<marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a7f45"/></marker>
<marker id="al" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3b5bdb"/></marker>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3271e"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="560" fill="#fff"/>
<text x="26" y="32" font-size="17" font-weight="700" fill="#1f2329">复盘优化链路 · 双控制器自进化闭环</text>
<text x="26" y="52" font-size="12" fill="#8a9099">所有主体写同一张 decision_log → 可比 → 可复盘 → 可晋升。内环改主体质量,外环改路由(谁执行),regime 拐点自动收权回人。</text>

<!-- inner feedback arc (green, over the top) -->
<path d="M957,168 C957,96 315,96 315,168" fill="none" stroke="#1a7f45" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ag)"/>
<text x="636" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f45">内环 · 优化主体:改公式/阈值 · prompt/few-shot · 重训 · 给人反馈</text>

<!-- stage boxes -->
<g font-size="12">
<rect x="26" y="168" width="150" height="58" rx="8" fill="#fff" stroke="#c9d2f0" stroke-width="1.4"/><text x="101" y="192" text-anchor="middle" font-weight="700" fill="#1f2329">① 事前登记</text><text x="101" y="210" text-anchor="middle" font-size="9.5" fill="#8a9099">anchor+candidates(预期)</text>
<rect x="240" y="168" width="150" height="58" rx="8" fill="#eef1fb" stroke="#3b5bdb" stroke-width="1.4"/><text x="315" y="192" text-anchor="middle" font-weight="700" fill="#3b5bdb">② 执行 + 影子</text><text x="315" y="210" text-anchor="middle" font-size="9.5" fill="#5a6069">4主体同锚·非acting静默预测</text>
<rect x="454" y="168" width="150" height="58" rx="8" fill="#fff" stroke="#c9d2f0" stroke-width="1.4"/><text x="529" y="192" text-anchor="middle" font-weight="700" fill="#1f2329">③ 回填 outcome</text><text x="529" y="210" text-anchor="middle" font-size="9.5" fill="#8a9099">到期(节奏=horizon)</text>
<rect x="668" y="168" width="150" height="58" rx="8" fill="#fff" stroke="#c9d2f0" stroke-width="1.4"/><text x="743" y="192" text-anchor="middle" font-weight="700" fill="#1f2329">④ 打分</text><text x="743" y="210" text-anchor="middle" font-size="9.5" fill="#8a9099">校准/IC/归因·切片</text>
<rect x="882" y="168" width="150" height="58" rx="8" fill="#fff" stroke="#c9d2f0" stroke-width="1.4"/><text x="957" y="192" text-anchor="middle" font-weight="700" fill="#1f2329">⑤ 诊断</text><text x="957" y="210" text-anchor="middle" font-size="9.5" fill="#8a9099">miscalib/drift/影子超人/priced</text>
</g>
<!-- forward arrows -->
<g>
<path d="M176,197 L238,197" fill="none" stroke="#8a9099" stroke-width="1.6" marker-end="url(#ab)"/>
<path d="M390,197 L452,197" fill="none" stroke="#8a9099" stroke-width="1.6" marker-end="url(#ab)"/>
<path d="M604,197 L666,197" fill="none" stroke="#8a9099" stroke-width="1.6" marker-end="url(#ab)"/>
<path d="M818,197 L880,197" fill="none" stroke="#8a9099" stroke-width="1.6" marker-end="url(#ab)"/>
</g>

<!-- outer feedback (blue) through gate -->
<path d="M957,226 C945,300 690,346 588,352" fill="none" stroke="#3b5bdb" stroke-width="1.8" stroke-dasharray="5 3"/>
<path d="M412,352 C300,352 315,262 315,228" fill="none" stroke="#3b5bdb" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#al)"/>
<text x="700" y="300" font-size="11" font-weight="600" fill="#3b5bdb">外环 · 路由:晋升/降级 executor_kind</text>

<!-- gate diamond -->
<polygon points="500,316 588,352 500,388 412,352" fill="#eef1fb" stroke="#3b5bdb" stroke-width="1.6"/>
<text x="500" y="349" text-anchor="middle" font-size="12" font-weight="700" fill="#3b5bdb">校准闸</text>
<text x="500" y="365" text-anchor="middle" font-size="9" fill="#5a6069">human→shadow→assisted→auto</text>

<!-- regime box -->
<rect x="120" y="452" width="190" height="46" rx="8" fill="#fbeaea" stroke="#e6a9a9" stroke-width="1.4"/><text x="215" y="472" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b3271e">Regime 监测</text><text x="215" y="488" text-anchor="middle" font-size="9.5" fill="#a24b45">基率是否还成立</text>
<path d="M310,464 C400,430 452,398 470,378" fill="none" stroke="#b3271e" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="330" y="430" font-size="10" fill="#b3271e">regime 变 → auto 隔离回 shadow</text>

<!-- P&L box -->
<rect x="720" y="452" width="220" height="46" rx="8" fill="#e0f0f2" stroke="#bfe0e4" stroke-width="1.4"/><text x="830" y="472" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0e7490">P&amp;L 归因(北极星)</text><text x="830" y="488" text-anchor="middle" font-size="9.5" fill="#3d7f8c">校准必要非充分,priced 则无 edge</text>
<path d="M812,452 C795,340 760,262 749,228" fill="none" stroke="#0e7490" stroke-width="1.6" marker-end="url(#al)" stroke-dasharray="0"/>
<path d="M745,228 L745,228" fill="none" stroke="#0e7490"/>

<!-- three iron rules note -->
<rect x="26" y="248" width="1006" height="40" rx="7" fill="#fbfcfd" stroke="#e6e8eb"/>
<text x="40" y="264" font-size="10.5" font-weight="700" fill="#5a6069">三条铁律</text>
<text x="40" y="280" font-size="10.5" fill="#454b52">① 事前登记(anchor+预期在 outcome 前)防事后诸葛　② 影子日志:非 acting 主体同锚静默预测并记 = 晋升燃料　③ candidate_pool.rejected = 反事实对照,别只从做了的学</text>

<!-- legend -->
<g font-size="10" transform="translate(26,524)">
<line x1="0" y1="-3" x2="26" y2="-3" stroke="#1a7f45" stroke-width="1.8" stroke-dasharray="5 3"/><text x="32" y="0" fill="#454b52">内环=优化主体质量</text>
<line x1="180" y1="-3" x2="206" y2="-3" stroke="#3b5bdb" stroke-width="1.8" stroke-dasharray="5 3"/><text x="212" y="0" fill="#454b52">外环=优化路由(谁执行)</text>
<line x1="380" y1="-3" x2="406" y2="-3" stroke="#b3271e" stroke-width="1.6"/><text x="412" y="0" fill="#454b52">regime 触发降级隔离</text>
<text x="580" y="0" fill="#8a9099">运行档 = min(能力上限, 校准闸允许成熟度)</text>
</g>
</svg>
