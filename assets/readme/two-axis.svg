<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <rect width="1200" height="470" rx="18" fill="#FBFCFE"/>
  <rect x="1" y="1" width="1198" height="468" rx="17" fill="none" stroke="#E0E3EB" stroke-width="1"/>

  <text x="600" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#131722">两条线 · 一个系统的两个投影</text>
  <text x="600" y="54" text-anchor="middle" font-size="12.5" fill="#5B6472">上 = 计算范式(动态:信号怎么流)· 下 = 交付三层(静态:数据落在哪 · 面板给谁看)</text>

  <!-- ① 计算范式 · 动态 -->
  <text x="48" y="86" font-size="12" font-weight="600" fill="#2158E0">① 计算范式 · 动态</text>
  <g>
    <rect x="48"  y="96" width="196" height="48" rx="10" fill="#EAF0FE" stroke="#2962FF" stroke-width="1.3"/>
    <text x="146" y="118" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#2158E0">REPRESENT</text>
    <text x="146" y="136" text-anchor="middle" font-size="13" fill="#131722">表征 · 压缩</text>

    <rect x="320" y="96" width="150" height="48" rx="10" fill="#F1EBFE" stroke="#8B5CF6" stroke-width="1.3"/>
    <text x="395" y="118" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1" fill="#7C3AED">PROPOSE</text>
    <text x="395" y="136" text-anchor="middle" font-size="13" fill="#131722">生成空间</text>

    <rect x="490" y="96" width="150" height="48" rx="10" fill="#E3F4F0" stroke="#089981" stroke-width="1.3"/>
    <text x="565" y="118" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1" fill="#077568">PREDICT</text>
    <text x="565" y="136" text-anchor="middle" font-size="13" fill="#131722">预判</text>

    <rect x="660" y="96" width="150" height="48" rx="10" fill="#FDF1DC" stroke="#E0912B" stroke-width="1.3"/>
    <text x="735" y="118" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1" fill="#B26A00">SELECT</text>
    <text x="735" y="136" text-anchor="middle" font-size="13" fill="#131722">剪枝</text>
  </g>
  <g fill="#9AA3B2" font-size="20">
    <text x="282" y="127" text-anchor="middle">→</text>
    <text x="480" y="127" text-anchor="middle">→</text>
    <text x="650" y="127" text-anchor="middle">→</text>
  </g>

  <!-- 映射连线(算子 ↓ 层) -->
  <g stroke="#B2B5BE" stroke-width="1.3" stroke-dasharray="4 4">
    <line x1="146" y1="144" x2="146" y2="322"/>
    <line x1="395" y1="144" x2="395" y2="322"/>
    <line x1="565" y1="144" x2="565" y2="322"/>
    <line x1="735" y1="144" x2="735" y2="322"/>
  </g>

  <!-- ② 交付三层 · 静态 -->
  <text x="48" y="308" font-size="12" font-weight="600" fill="#5B6472">② 交付三层 · 静态(面板结构)</text>
  <rect x="48"  y="322" width="196" height="88" rx="12" fill="#EAF0FE" stroke="#2962FF" stroke-width="1.4"/>
  <text x="146" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#131722">原数据层</text>
  <text x="146" y="384" text-anchor="middle" font-size="11" fill="#5B6472">四类 fct + 元数据</text>
  <text x="146" y="399" text-anchor="middle" font-size="11" fill="#5B6472">+ per-path 原料(B1)</text>

  <rect x="320" y="322" width="490" height="88" rx="12" fill="#F3F1FA" stroke="#8B5CF6" stroke-width="1.6"/>
  <text x="565" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#131722">判断层 · 引擎</text>
  <text x="565" y="384" text-anchor="middle" font-size="11.5" fill="#5B6472">边 / 两道闸 / 因子 / decision_log 六元组</text>
  <text x="565" y="399" text-anchor="middle" font-size="11" fill="#7C3AED">PROPOSE + PREDICT + SELECT 三算子之家</text>

  <rect x="860" y="322" width="292" height="88" rx="12" fill="#E3F4F0" stroke="#089981" stroke-width="1.4"/>
  <text x="1006" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#131722">结果层</text>
  <text x="1006" y="384" text-anchor="middle" font-size="11.5" fill="#5B6472">per-ticker 证据结构卡 + 结论(B2)</text>
  <text x="1006" y="399" text-anchor="middle" font-size="11" fill="#077568">= SELECT 的产出</text>

  <!-- 判断层 → 结果层 产出 -->
  <line x1="810" y1="366" x2="855" y2="366" stroke="#089981" stroke-width="1.6"/>
  <path d="M860 366 L850 361 v10 z" fill="#089981"/>
  <rect x="815" y="340" width="40" height="15" fill="#FBFCFE"/>
  <text x="835" y="352" text-anchor="middle" font-size="10.5" fill="#077568">产出</text>

  <!-- 闭环反馈:结果层 → 判断层 -->
  <path d="M1006 410 C1006 442 1006 444 962 444 L609 444 C565 444 565 442 565 410" fill="none" stroke="#9AA3B2" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M565 410 L559 421 h12 z" fill="#9AA3B2"/>
  <rect x="700" y="435" width="170" height="18" fill="#FBFCFE"/>
  <text x="785" y="448" text-anchor="middle" font-size="12" fill="#7A8494">闭环 · outcome 回灌校准</text>
</svg>
