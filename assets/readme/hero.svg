<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <rect width="1280" height="380" rx="20" fill="#0E1524"/>
  <rect x="1" y="1" width="1278" height="378" rx="19" fill="none" stroke="#1E2A44" stroke-width="1"/>

  <!-- 右上角 causal-graph 装饰 -->
  <g opacity="0.55" stroke="#2E4980" stroke-width="1.4" fill="#5B8CFF">
    <line x1="1116" y1="70" x2="1176" y2="96"/>
    <line x1="1176" y1="96" x2="1120" y2="128"/>
    <line x1="1120" y1="128" x2="1196" y2="148"/>
    <line x1="1116" y1="70" x2="1210" y2="60"/>
    <circle cx="1116" cy="70" r="5"/>
    <circle cx="1176" cy="96" r="4" fill="#A98BFF"/>
    <circle cx="1120" cy="128" r="4" fill="#23C9A7"/>
    <circle cx="1196" cy="148" r="5" fill="#FBC15A"/>
    <circle cx="1210" cy="60" r="3"/>
  </g>

  <!-- 标题区 -->
  <text x="64" y="60" font-size="14" font-weight="600" letter-spacing="3" fill="#5B6B84">GROWTH-EQUITY FUND · 港股 / 美股 · INTELLIGENCE GRAPH</text>
  <text x="63" y="120" font-size="46" font-weight="800" fill="#F4F6FB">AI 发展监测体系</text>
  <text x="66" y="150" font-size="16" letter-spacing="1" fill="#8A96AC">AI-Development Monitoring System · 一张自我校准的因果图</text>
  <g>
    <rect x="66" y="166" width="34" height="4" rx="2" fill="#2962FF"/>
    <rect x="106" y="166" width="34" height="4" rx="2" fill="#8B5CF6"/>
    <rect x="146" y="166" width="34" height="4" rx="2" fill="#089981"/>
    <rect x="186" y="166" width="34" height="4" rx="2" fill="#F5A623"/>
  </g>

  <!-- 闭环回边(置于节点之下) -->
  <path d="M1094 308 C1094 352 1094 354 1050 354 L232 354 C188 354 188 352 188 308" fill="none" stroke="#55617A" stroke-width="1.6" stroke-dasharray="5 5"/>
  <path d="M188 302 L182 313 L194 313 Z" fill="#55617A"/>
  <rect x="585" y="345" width="118" height="18" fill="#0E1524"/>
  <text x="644" y="358" text-anchor="middle" font-size="13" fill="#7E8AA0">闭环 · outcome → 校准</text>

  <!-- 四算子节点 -->
  <g>
    <rect x="64" y="236" width="248" height="72" rx="12" fill="#142038" stroke="#2962FF" stroke-width="1.4"/>
    <text x="188" y="268" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#5B8CFF">REPRESENT</text>
    <text x="188" y="293" text-anchor="middle" font-size="17" fill="#E6EAF2">压缩 · 表征</text>

    <rect x="366" y="236" width="248" height="72" rx="12" fill="#1E1836" stroke="#8B5CF6" stroke-width="1.4"/>
    <text x="490" y="268" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#A98BFF">PROPOSE</text>
    <text x="490" y="293" text-anchor="middle" font-size="17" fill="#E6EAF2">枚举 · 候选</text>

    <rect x="668" y="236" width="248" height="72" rx="12" fill="#0F2A24" stroke="#089981" stroke-width="1.4"/>
    <text x="792" y="268" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#23C9A7">PREDICT</text>
    <text x="792" y="293" text-anchor="middle" font-size="17" fill="#E6EAF2">指标 · 预判</text>

    <rect x="970" y="236" width="248" height="72" rx="12" fill="#2A2412" stroke="#F5A623" stroke-width="1.4"/>
    <text x="1094" y="268" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#FBC15A">SELECT</text>
    <text x="1094" y="293" text-anchor="middle" font-size="17" fill="#E6EAF2">剪枝 · 选择</text>
  </g>

  <!-- 节点间箭头 -->
  <g fill="#55617A" font-size="22">
    <text x="339" y="279" text-anchor="middle">→</text>
    <text x="641" y="279" text-anchor="middle">→</text>
    <text x="943" y="279" text-anchor="middle">→</text>
  </g>

  <!-- 右下 tagline -->
  <text x="1216" y="120" text-anchor="end" font-size="15" fill="#6E7A90">不是重生成,是重决策</text>
  <text x="1216" y="146" text-anchor="end" font-size="15" fill="#6E7A90">为后来的 AI 基建做设计</text>
</svg>
