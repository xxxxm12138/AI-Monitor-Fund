<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <rect width="1200" height="534" rx="18" fill="#FBFCFE"/>
  <rect x="1" y="1" width="1198" height="532" rx="17" fill="none" stroke="#E0E3EB" stroke-width="1"/>

  <text x="600" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#131722">NBIS 实例 · AI 发展(D1–D7)→ 边 → 权重 → ticker(真实数据 · as-of 2026-09)</text>
  <text x="222" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#5B6472">AI 发展节点 · D 维 + 真数</text>
  <text x="556" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#5B6472">边 · 类型 / 跳数 / 验证 tier</text>
  <text x="777" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#5B6472">产出(权重)</text>

  <!-- 泳道连线 -->
  <g stroke="#D0D7E2" stroke-width="1.4">
    <line x1="408" y1="96" x2="893" y2="96"/>
    <line x1="408" y1="152" x2="893" y2="152"/>
    <line x1="408" y1="208" x2="893" y2="208"/>
    <line x1="408" y1="264" x2="893" y2="264"/>
    <line x1="408" y1="320" x2="893" y2="320"/>
  </g>
  <g fill="#AEB6C4">
    <path d="M895 96 l-10 -5 v10 z"/><path d="M895 152 l-10 -5 v10 z"/><path d="M895 208 l-10 -5 v10 z"/><path d="M895 264 l-10 -5 v10 z"/><path d="M895 320 l-10 -5 v10 z"/>
  </g>

  <!-- NBIS 汇聚节点 -->
  <rect x="895" y="73" width="150" height="270" rx="12" fill="#2962FF"/>
  <text x="970" y="205" text-anchor="middle" font-size="26" font-weight="800" fill="#FFFFFF">NBIS</text>
  <text x="970" y="230" text-anchor="middle" font-size="12" fill="#CFE0FF">51% · neocloud</text>

  <!-- 节点 + 边 + 产出:五条链 -->
  <!-- lane1 D1 光互连 -->
  <g font-size="12.5" fill="#131722">
    <rect x="36" y="73" width="372" height="46" rx="8" fill="#FFFFFF" stroke="#E0E3EB"/>
    <rect x="48" y="85" width="30" height="22" rx="5" fill="#2962FF"/><text x="63" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">D1</text>
    <text x="88" y="101">光互连出货 · 中际旭创</text><text x="396" y="101" text-anchor="end" font-weight="700" fill="#089981">+192%</text>
    <rect x="430" y="80" width="252" height="32" rx="8" fill="#F0F3FA" stroke="#D0D7E2"/><text x="556" y="100" text-anchor="middle">E2 供应链 · 3 跳 · T1 可回测</text>
    <rect x="702" y="80" width="150" height="32" rx="8" fill="#E3F4F0" stroke="#089981"/><text x="777" y="100" text-anchor="middle" fill="#077568" font-weight="600">可交易(beta)</text>
  </g>
  <!-- lane2 D1 电力 -->
  <g font-size="12.5" fill="#131722">
    <rect x="36" y="129" width="372" height="46" rx="8" fill="#FFFFFF" stroke="#E0E3EB"/>
    <rect x="48" y="141" width="30" height="22" rx="5" fill="#2962FF"/><text x="63" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">D1</text>
    <text x="88" y="157">自有电力上电 · 5GW 在建</text><text x="396" y="157" text-anchor="end" font-weight="700" fill="#E0912B">★ 关键</text>
    <rect x="430" y="136" width="252" height="32" rx="8" fill="#F0F3FA" stroke="#D0D7E2"/><text x="556" y="156" text-anchor="middle">E2 直接 · 1 跳 · T2 结构</text>
    <rect x="702" y="136" width="150" height="32" rx="8" fill="#E3F4F0" stroke="#089981"/><text x="777" y="156" text-anchor="middle" fill="#077568" font-weight="600">可交易 ★</text>
  </g>
