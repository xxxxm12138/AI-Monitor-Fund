  <g font-size="12.5" fill="#131722">
    <rect x="36" y="185" width="372" height="46" rx="8" fill="#FFFFFF" stroke="#E0E3EB"/>
    <rect x="48" y="197" width="30" height="22" rx="5" fill="#089981"/><text x="63" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">D3</text>
    <text x="88" y="213">前沿 lab 融资 · Reflection</text><text x="396" y="213" text-anchor="end" font-weight="700" fill="#089981">→ $1B 合同</text>
    <rect x="430" y="192" width="252" height="32" rx="8" fill="#F0F3FA" stroke="#D0D7E2"/><text x="556" y="212" text-anchor="middle">E3 需求 · 2 跳 · T2 对账</text>
    <rect x="702" y="192" width="150" height="32" rx="8" fill="#FDF1DC" stroke="#E0912B"/><text x="777" y="212" text-anchor="middle" fill="#B26A00" font-weight="600">预警(命中风险)</text>
  </g>
  <!-- lane4 D5 能力前沿 -->
  <g font-size="12.5" fill="#131722">
    <rect x="36" y="241" width="372" height="46" rx="8" fill="#FFFFFF" stroke="#E0E3EB"/>
    <rect x="48" y="253" width="30" height="22" rx="5" fill="#8B5CF6"/><text x="63" y="269" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">D5</text>
    <text x="88" y="269">能力前沿 → 推理需求</text><text x="396" y="269" text-anchor="end" font-weight="700" fill="#7C3AED">+4–5×/yr</text>
    <rect x="430" y="248" width="252" height="32" rx="8" fill="#F0F3FA" stroke="#D0D7E2"/><text x="556" y="268" text-anchor="middle">E3 需求 · 3 跳 · T3 方向</text>
    <rect x="702" y="248" width="150" height="32" rx="8" fill="#F0F3FA" stroke="#D0D7E2"/><text x="777" y="268" text-anchor="middle" fill="#5A5D68" font-weight="600">方向(不下注)</text>
