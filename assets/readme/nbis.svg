  <!-- lane5 D7 regime -->
  <g font-size="12.5" fill="#131722">
    <rect x="36" y="297" width="372" height="46" rx="8" fill="#FFFFFF" stroke="#E0E3EB"/>
    <rect x="48" y="309" width="30" height="22" rx="5" fill="#E0912B"/><text x="63" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">D7</text>
    <text x="88" y="325">政策 regime · 出口管制 / 电力</text>
    <rect x="430" y="304" width="252" height="32" rx="8" fill="#F0F3FA" stroke="#D0D7E2"/><text x="556" y="324" text-anchor="middle">regime · 2 跳 · T2</text>
    <rect x="702" y="304" width="150" height="32" rx="8" fill="#FDF1DC" stroke="#E0912B"/><text x="777" y="324" text-anchor="middle" fill="#B26A00" font-weight="600">regime 预警</text>
  </g>

  <text x="36" y="366" font-size="11.5" fill="#7A8494">产出 = 映射价值 V(传导确定性 × 节点质量);<tspan font-weight="600" fill="#5B6472">方向与 cert_tier 由分析师判断,可校准</tspan>——这一层就是"判断",与数据分表进决策层。</text>

  <!-- 对账 -->
  <rect x="36" y="384" width="1128" height="62" rx="10" fill="#F5F7FB" stroke="#E0E3EB"/>
  <text x="56" y="409" font-size="12.5" font-weight="700" fill="#5B6472">供给读 ⟷ 需求读 对账</text>
  <g font-size="12.5">
    <circle cx="66" cy="429" r="5" fill="#089981"/><text x="80" y="434" fill="#131722"><tspan font-weight="700" fill="#077568">同向</tspan>(供给猛建 + 需求涌入)→ 周期健康 · 支持加仓</text>
    <circle cx="600" cy="429" r="5" fill="#F23645"/><text x="614" y="434" fill="#131722"><tspan font-weight="700" fill="#C0293A">背离</tspan>(供给建 · 需求转冷)→ neocloud 泡沫 / 循环融资预警(WeWork 2.0)· 减仓</text>
  </g>

  <!-- 已兑现 -->
  <rect x="36" y="454" width="1128" height="58" rx="10" fill="#E3F4F0" stroke="#089981" stroke-width="1.2"/>
  <text x="56" y="479" font-size="12.5" font-weight="700" fill="#077568">已兑现 ✓ 三条边级方向预测全部 correct</text>
  <text x="56" y="500" font-size="12" fill="#131722">光模块 ↑ → NBIS ↑ &#160;·&#160; lab 融资 → 签 $1B 合同 &#160;·&#160; hyperscaler capex ↑ → NBIS &#160;&#160;(命中率 100% @ 中置信 · 小样本诚实标注)</text>
