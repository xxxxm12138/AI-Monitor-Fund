<!-- RBRK caption -->
<line class="divl" x1="614" y1="418" x2="1146" y2="418"/>
<text class="capb" x="614" y="442">读法</text>
<text class="cap" x="614" y="462">版权+监管<tspan class="risk"> 共用「治理预算」节点</tspan> → 条形数成 2,图算=1。</text>
<text class="cap" x="614" y="480">多头只剩 2 通道,增长全押 <tspan class="risk">单节点「企业采用」</tspan> → 断即空。</text>
<text class="cap" x="614" y="498"><tspan class="capb">意外</tspan>:Sub-ARR +33%(一手 nowcast,信息量高)。</text>
<text class="cap" x="614" y="516"><tspan class="capb">edge</tspan>:Sub-ARR 早于财报读到。<tspan class="capb">动作</tspan>:观察·单线待再确认。</text>

<!-- legend -->
<line class="divl" x1="26" y1="556" x2="1146" y2="556"/>
<g transform="translate(26,580)">
<rect x="0" y="-10" width="26" height="3" fill="#b3271e"/><text x="34" y="-4" font-size="11px" fill="#454b52">红边/红框 = 割点(最小割),单点风险</text>
<rect x="300" y="-11" width="16" height="16" rx="4" class="choke"/><text x="324" y="-4" font-size="11px" fill="#454b52">共用节点 = 独立性塌缩(2→1)</text>
<line x1="600" y1="-9" x2="626" y2="-9" stroke="#9aa0a8" stroke-width="1.6" stroke-dasharray="4 3"/><text x="634" y="-4" font-size="11px" fill="#454b52">虚线 = 做空/反向路径</text>
<text x="820" y="-4" font-size="11px" fill="#8a9099">意外/edge/动作 = 文字数据点,不进图</text>
</g>
