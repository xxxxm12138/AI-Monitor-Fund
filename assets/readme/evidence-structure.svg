<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa0a8"/></marker>
<marker id="ahr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b3271e"/></marker>
<style>
.bg{fill:#fff}
.ttl{fill:#1f2329;font-size:17px;font-weight:700}
.sub{fill:#8a9099;font-size:12px}
.hd{font-size:13.5px;font-weight:700}
.tag{fill:#8a9099;font-size:10.5px}
.node rect{rx:7}
.nlab{font-size:11.5px;font-weight:600}
.mlab{font-size:11px}
.tk{fill:#1f2329;font-size:16px;font-weight:800}
.tw{fill:#fff;font-size:10px;font-weight:600}
.cap{fill:#454b52;font-size:11.5px}
.capb{fill:#1f2329;font-size:11.5px;font-weight:700}
.risk{fill:#b3271e;font-size:10.5px;font-weight:700}
.edge{stroke:#c3c8ce;stroke-width:1.6;fill:none}
.edger{stroke:#b3271e;stroke-width:2;fill:none}
.edged{stroke:#9aa0a8;stroke-width:1.6;fill:none;stroke-dasharray:4 3}
.f1{fill:#2f4bb3}.f2{fill:#1a7f45}.f3{fill:#6b4bc4}.f4{fill:#0e7490}.f5{fill:#b5730c}.gr{fill:#8a9099}
.sr{fill:#eef1fb;stroke:#c9d2f0}.sg{fill:#e3f4e9;stroke:#bfe3cc}.sp{fill:#efeafc;stroke:#ddd3f3}.st{fill:#e0f0f2;stroke:#bfe0e4}.sa{fill:#fbf0dd;stroke:#efdcae}.sn{fill:#f3f4f6;stroke:#e0e3e7}
.mech{fill:#fbfbfd;stroke:#dfe3e8}
.choke{fill:#fbeaea;stroke:#e6a9a9;stroke-width:1.6}
.tkbox{fill:#1f2329}
.divl{stroke:#e6e8eb;stroke-width:1}
</style>
</defs>
<rect class="bg" x="0" y="0" width="1180" height="620"/>
<text class="ttl" x="26" y="34">证据结构图 · 稳健性与风险是同一张图</text>
<text class="sub" x="26" y="55">节点不相交路径数 = 最小割(门格尔定理)。宽扇入 = 稳健;共用节点 = 佐证塌缩;割点标红 = 单点风险。真数据来自 graph_data.py 传导链。</text>
<line class="divl" x1="590" y1="80" x2="590" y2="540"/>

<!-- ================= NBIS ================= -->
<text class="hd" x="34" y="98" fill="#1a7f45">NBIS · 宽 / 稳健(主线有咽喉)</text>
<text class="tag" x="34" y="115">6 条独立通道 → 最小割=6</text>

<!-- sources -->
<g class="node">
<rect class="sr" x="34" y="132" width="150" height="34" stroke-width="1"/><rect class="f1" x="34" y="132" width="4" height="34"/><text class="nlab f1" x="46" y="153">供给·光/GPU/capex</text>
<rect class="sg" x="34" y="176" width="150" height="34" stroke-width="1"/><rect class="f2" x="34" y="176" width="4" height="34"/><text class="nlab f2" x="46" y="197">需求·lab 融资/token</text>
<rect class="sp" x="34" y="220" width="150" height="34" stroke-width="1"/><rect class="f3" x="34" y="220" width="4" height="34"/><text class="nlab f3" x="46" y="241">能力·训练/AA/bench</text>
<rect class="st" x="34" y="264" width="150" height="34" stroke-width="1"/><rect class="f4" x="34" y="264" width="4" height="34"/><text class="nlab f4" x="46" y="285">变现·推理弹性/cost</text>
<rect class="sa" x="34" y="308" width="150" height="34" stroke-width="1"/><rect class="f5" x="34" y="308" width="4" height="34"/><text class="nlab f5" x="46" y="329">政体·出口/循环融资</text>
<rect class="sn" x="34" y="352" width="150" height="34" stroke-width="1"/><rect class="gr" x="34" y="352" width="4" height="34"/><text class="nlab gr" x="46" y="373">本体·backlog / 上电</text>
</g>

<!-- mechs -->
<g class="node">
<rect class="choke" x="252" y="132" width="150" height="34"/><text class="mlab risk" x="264" y="147">neocloud 上电/在建</text><text class="risk" x="264" y="160">▲ 主线最小割=1</text>
<rect class="mech" x="252" y="176" width="150" height="34" stroke-width="1"/><text class="mlab" x="264" y="197" fill="#454b52">lab 算力采购力</text>
<rect class="mech" x="252" y="220" width="150" height="34" stroke-width="1"/><text class="mlab" x="264" y="241" fill="#454b52">推理/训练需求</text>
<rect class="mech" x="252" y="264" width="150" height="34" stroke-width="1"/><text class="mlab" x="264" y="285" fill="#454b52">推理需求弹性</text>
</g>

