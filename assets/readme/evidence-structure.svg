<!-- NBIS caption -->
<line class="divl" x1="34" y1="418" x2="560" y2="418"/>
<text class="capb" x="34" y="442">读法</text>
<text class="cap" x="34" y="462">6 条通道同时打到 → 断任一条,thesis 仍立(稳健)。</text>
<text class="cap" x="34" y="480">但价格主线=供给,全汇于 <tspan class="risk">neocloud 上电</tspan> → 断此点掉 3 条供给链,</text>
<text class="cap" x="34" y="498">退回"本体+需求"。<tspan class="capb">意外</tspan>:旭创 +182% vs 事前预期(待钉指引)。</text>
<text class="cap" x="34" y="516"><tspan class="capb">edge</tspan>:中国侧光模块营收先于美国分析师看到。<tspan class="capb">动作</tspan>:持有·回调加。</text>

<!-- ================= RBRK ================= -->
<text class="hd" x="614" y="98" fill="#b5730c">RBRK · 窄 / 脆弱(佐证塌缩到单点)</text>
<text class="tag" x="614" y="115">看似 4 源,实为 2 条独立多头通道</text>

<!-- sources -->
<g class="node">
<rect class="sg" x="614" y="150" width="150" height="34" stroke-width="1"/><rect class="f2" x="614" y="150" width="4" height="34"/><text class="nlab f2" x="626" y="171">企业采用(Sub-ARR)</text>
<rect class="st" x="614" y="212" width="150" height="34" stroke-width="1"/><rect class="f4" x="614" y="212" width="4" height="34"/><text class="nlab f4" x="626" y="233">版权诉讼</text>
<rect class="sa" x="614" y="256" width="150" height="34" stroke-width="1"/><rect class="f5" x="614" y="256" width="4" height="34"/><text class="nlab f5" x="626" y="277">AI 监管</text>
<rect class="sn" x="614" y="326" width="150" height="34" stroke-width="1"/><rect class="gr" x="614" y="326" width="4" height="34"/><text class="nlab gr" x="626" y="347">新范式(做空侧)</text>
</g>

<!-- mechs -->
<g class="node">
<rect class="choke" x="832" y="150" width="152" height="34"/><text class="mlab risk" x="844" y="165">企业数据就绪</text><text class="risk" x="844" y="178">▲ 增长引擎=单节点</text>
<rect x="832" y="230" width="152" height="34" rx="7" fill="#fdf5e6" stroke="#e9d09a" stroke-width="1.6"/><text class="mlab" x="844" y="245" fill="#8a5a08">治理/合规预算</text><text x="844" y="258" font-size="10.5px" font-weight="700" fill="#b5730c">◆ 2 条汇于此 → 合为 1</text>
</g>

