<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <rect width="1200" height="440" rx="18" fill="#FBFCFE"/>
  <rect x="1" y="1" width="1198" height="438" rx="17" fill="none" stroke="#E0E3EB" stroke-width="1"/>

  <text x="600" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="#5B6472">供需对接 · 逐票向上游反推 · 六类边 → 跳数 → 权重</text>
  <text x="150" y="66" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="1" fill="#2158E0">AI 供给侧 · D1–D7</text>
  <text x="1050" y="66" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="1" fill="#2158E0">持仓 ticker · 13F 权重</text>

  <!-- 连线:左收敛到 hub,再从 hub 发散到右 -->
  <g stroke="#C6CEDD" stroke-width="1" opacity="0.9">
    <line x1="260" y1="104" x2="515" y2="235"/>
    <line x1="260" y1="148" x2="515" y2="235"/>
    <line x1="260" y1="192" x2="515" y2="235"/>
    <line x1="260" y1="236" x2="515" y2="235"/>
    <line x1="260" y1="280" x2="515" y2="235"/>
    <line x1="260" y1="324" x2="515" y2="235"/>
    <line x1="260" y1="368" x2="515" y2="235"/>
    <line x1="685" y1="235" x2="940" y2="122"/>
    <line x1="685" y1="235" x2="940" y2="182"/>
    <line x1="685" y1="235" x2="940" y2="242"/>
    <line x1="685" y1="235" x2="940" y2="302"/>
    <line x1="685" y1="235" x2="940" y2="362"/>
  </g>

  <!-- 左:AI 供给节点 D1–D7 -->
  <g font-size="13" fill="#1C2430">
    <rect x="40" y="86"  width="220" height="36" rx="8" fill="#EAF0FE" stroke="#B9C6E6"/><text x="58" y="109">D1 算力供给</text>
    <rect x="40" y="130" width="220" height="36" rx="8" fill="#EAF0FE" stroke="#B9C6E6"/><text x="58" y="153">D2 数据供给</text>
    <rect x="40" y="174" width="220" height="36" rx="8" fill="#EAF0FE" stroke="#B9C6E6"/><text x="58" y="197">D3 资本(需求真伪)</text>
    <rect x="40" y="218" width="220" height="36" rx="8" fill="#EAF0FE" stroke="#B9C6E6"/><text x="58" y="241">D4 人才</text>
    <rect x="40" y="262" width="220" height="36" rx="8" fill="#EAF0FE" stroke="#B9C6E6"/><text x="58" y="285">D5 能力前沿</text>
    <rect x="40" y="306" width="220" height="36" rx="8" fill="#EAF0FE" stroke="#B9C6E6"/><text x="58" y="329">D6 商用 · token</text>
    <rect x="40" y="350" width="220" height="36" rx="8" fill="#EAF0FE" stroke="#B9C6E6"/><text x="58" y="373">D7 政策 · 能源</text>
  </g>

  <!-- 中:六类边 / 跳数 / 权重 hub -->
  <rect x="515" y="185" width="170" height="100" rx="12" fill="#F1EBFE" stroke="#8B5CF6" stroke-width="1.6"/>
  <text x="600" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#1C2430">六类边 E1–E6</text>
  <text x="600" y="240" text-anchor="middle" font-size="12" fill="#7C3AED">跳数 · T1/T2/T3 验证</text>
  <text x="600" y="262" text-anchor="middle" font-size="11.5" fill="#5B6472">价值 = 传导 × 节点质量</text>

  <!-- 右:持仓 ticker -->
  <g font-size="13" fill="#1C2430">
    <rect x="940" y="100" width="220" height="44" rx="8" fill="#EAF0FE" stroke="#2962FF" stroke-width="1.3"/><text x="960" y="127">NBIS · 51%</text>
    <rect x="940" y="160" width="220" height="44" rx="8" fill="#EAF0FE" stroke="#2962FF" stroke-width="1.3"/><text x="960" y="187">RBRK · 30%</text>
    <rect x="940" y="220" width="220" height="44" rx="8" fill="#EAF0FE" stroke="#2962FF" stroke-width="1.3"/><text x="960" y="247">STAA · 8%</text>
    <rect x="940" y="280" width="220" height="44" rx="8" fill="#EAF0FE" stroke="#2962FF" stroke-width="1.3"/><text x="960" y="307">FCEL · 7%</text>
    <rect x="940" y="340" width="220" height="44" rx="8" fill="#EAF0FE" stroke="#2962FF" stroke-width="1.3"/><text x="960" y="367">尾仓 · MU / CIEN…</text>
  </g>

  <text x="600" y="420" text-anchor="middle" font-size="11.5" fill="#7A8494">E1 本体 · E2 供应链 · E3 下游需求 · E4 竞对替代 · E5 主题轮动 · E6 资金人才</text>
</svg>
