<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>库浏览 · Anatole AI 发展监测</title>
<style>
:root{--bg:#fff;--bg2:#f6f7f9;--bd:#e0e3eb;--fg:#131722;--fg2:#5d606b;--fg3:#9598a1;--acc:#2962ff;--ok:#089981;--warn:#f23645;--sel:#e8eefc;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131722;--bg2:#1b1f2b;--bd:#2a2e39;--fg:#d1d4dc;--fg2:#9598a1;--fg3:#6a6d78;--sel:#1f2a44}}
:root[data-theme=dark]{--bg:#131722;--bg2:#1b1f2b;--bd:#2a2e39;--fg:#d1d4dc;--fg2:#9598a1;--fg3:#6a6d78;--sel:#1f2a44}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif}
.shell{display:grid;grid-template-columns:270px 1fr;height:100vh}
aside{border-right:1px solid var(--bd);overflow:auto;background:var(--bg2)}
.brand{padding:14px 16px 8px;border-bottom:1px solid var(--bd)}.brand b{font-size:14px}.brand .meta{color:var(--fg2);font-size:11px;margin-top:4px;line-height:1.6}
.search{padding:8px 12px}.search input{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
.layer{padding:8px 0 4px}.layer h4{margin:0;padding:6px 16px 2px;font-size:11px;color:var(--fg3);font-weight:600;letter-spacing:.02em}.layer .ld{padding:0 16px 4px;font-size:11px;color:var(--fg3)}
.tb{display:flex;justify-content:space-between;padding:4px 16px;cursor:pointer;font-family:var(--mono);font-size:12px}.tb:hover{background:var(--sel)}.tb.on{background:var(--sel);color:var(--acc);font-weight:600}.tb .n{color:var(--fg3);font-family:inherit}
main{overflow:auto;padding:0 24px 40px}
.head{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--bd);z-index:3;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.head h2{margin:0;font-family:var(--mono);font-size:18px}.head .kind{font-size:11px;padding:2px 6px;border:1px solid var(--bd);border-radius:4px;color:var(--fg2)}.head .desc{color:var(--fg2);flex-basis:100%}
.tabs{display:flex;gap:4px;margin:12px 0}.tabs button{padding:5px 12px;border:1px solid var(--bd);background:var(--bg2);color:var(--fg);border-radius:14px;cursor:pointer}.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tools{display:flex;gap:10px;align-items:center;margin:8px 0;color:var(--fg2)}.tools input{padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);width:320px}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--bg2);color:var(--fg2);font-weight:600;cursor:pointer;white-space:nowrap;z-index:2}th.sorted{color:var(--acc)}
.dict td:first-child,.data td.k{font-family:var(--mono)}.dict .t{color:var(--fg3);font-family:var(--mono);font-size:11px;white-space:nowrap}
.bar{display:inline-block;width:64px;height:6px;background:var(--bd);border-radius:3px;vertical-align:middle;margin-right:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}.bar.z i{background:var(--warn)}
.data td{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.data td.x{white-space:normal;max-width:none}.data td:hover{white-space:normal}
.data td.nul{color:var(--fg3)}a.id{color:var(--acc);text-decoration:none;font-family:var(--mono)}a.id:hover{text-decoration:underline}
.mono{font-family:var(--mono)}.muted{color:var(--fg3)}.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sel);color:var(--acc);margin-left:6px}
.card{border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin:10px 0}.card h4{margin:0 0 6px;font-size:12px;color:var(--fg2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.top{position:fixed;right:14px;top:10px;z-index:5}.top button{border:1px solid var(--bd);background:var(--bg2);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer}
.mode{display:flex;gap:0;margin:8px 12px 4px;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.mode button{flex:1;padding:6px 0;border:0;background:var(--bg2);color:var(--fg2);cursor:pointer}.mode button.on{background:var(--fg);color:var(--bg)}
.node{display:flex;gap:10px;padding:8px 16px;cursor:pointer;align-items:flex-start}.node:hover{background:var(--sel)}.node.on{background:var(--sel)}.node .no{width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:11px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700}.node.on .no{background:var(--acc)}.node b{font-size:13px}.node .q{font-size:11px;color:var(--fg3)}
.chain{display:flex;align-items:center;gap:0;margin:14px 0 6px;overflow:auto}.chain .cb{flex:1;min-width:110px;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--bg2)}.chain .cb.on{border-color:var(--acc);background:var(--sel)}.chain .cb b{display:block;font-size:12px}.chain .cb span{font-size:11px;color:var(--fg3)}.chain .ar{padding:0 4px;color:var(--fg3)}
.concl{border-left:4px solid var(--acc);padding:10px 14px;margin:12px 0;background:var(--bg2);border-radius:0 8px 8px 0}.concl .q{font-weight:700;font-size:15px}.concl .c{margin-top:6px;font-size:14px;line-height:1.6}.concl .r{margin-top:6px;font-size:11px;color:var(--fg3)}
.fork{border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin:8px 0}.fork.detail{opacity:.85}.fork h4{margin:0 0 6px;font-size:13px}.fork h4 .w{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bd);color:var(--fg2);margin-left:6px;font-weight:500}
.opt{display:inline-block;padding:3px 10px;border:1px solid var(--bd);border-radius:14px;margin:2px 6px 2px 0;font-size:12px;color:var(--fg2)}.opt.on{border-color:var(--ok);color:var(--ok);font-weight:600}.opt.on::before{content:'✓ '}
.why{margin-top:6px}.why b{color:var(--fg2);font-weight:600}.ba{font-size:12px;color:var(--fg3);margin-top:4px}
.arts{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}.art{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--sel);color:var(--acc);cursor:pointer;font-family:var(--mono)}.art.k{background:var(--bd);color:var(--fg2);font-family:inherit}.art:hover{text-decoration:underline}
.anc{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--sel);color:var(--acc);cursor:pointer;margin-left:6px;white-space:nowrap}.anc:hover{text-decoration:underline}
body.present .fork.detail,body.present .arts,body.present .why,body.present .ba,body.present .concl .r{display:none}body.present .fork{padding:6px 12px}body.present .concl .q{font-size:20px}body.present .concl .c{font-size:17px}body.present .node .q{display:none}
@media (max-width:820px){.shell{grid-template-columns:1fr}aside{max-height:36vh}.grid2{grid-template-columns:1fr}.tools input{width:100%}}
</style>
</head>
<body>
<div class="top"><button id="present">演示模式</button> <button id="theme">明 / 暗</button></div>
<div class="shell">
<aside>
  <div class="brand"><b>库浏览 · Anatole AI 发展监测</b><div class="meta" id="meta"></div></div>
  <div class="mode"><button id="m-thesis" class="on">按思考脉络</button><button id="m-data">按数据层级</button></div>
  <div id="tnav"></div>
  <div class="search" id="qwrap" hidden><input id="q" placeholder="搜表名 / 视图名"></div>
  <div id="nav" hidden></div>
</aside>
<main>
  <div id="thesis"></div>
  <div id="datahead">
  <div class="head"><h2 id="tname">—</h2><span class="kind" id="tkind"></span><span class="muted" id="tn"></span><div class="desc" id="tdesc"></div></div>
  <div class="tabs"><button data-tab="dict" class="on">字段字典</button><button data-tab="data">数据</button><button data-tab="rel">关系与规则</button><button data-tab="mig">改库账</button></div>
  <section id="dict"></section>
  <section id="data" hidden></section>
  <section id="rel" hidden></section>
  <section id="mig" hidden></section>
  </div>
</main>
</div>
<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IDMAP = [[/^r\d{3}$/, 'stg_observation'], [/^m_/, 'metric_registry'], [/^e_/, 'edge_registry'], [/^ent_/, 'entity_master'], [/^src_/, 'source_master'], [/^kf\d/, 'key_fact'], [/^c\d{3}$/, 'calendar'], [/^[ABCR]\d{1,2}$/, 'assumption'], [/^\d{4}_[a-z]/, 'migration_log']];
function linkOf(v){ if (typeof v !== 'string' || v.length > 40) return null; for (const [re, t] of IDMAP) if (re.test(v) && D.tables[t]) return t; return null; }
let cur = null, tab = 'dict', sort = {col: null, dir: 1}, filter = '', mode = 'thesis', curNode = null;
const TH = D.thesis; const forksOf = n => TH.forks.filter(f => f.node_id === n); const anchorsOf = f => TH.anchors.filter(a => a.fork_id === f);
function setMode(m){ mode = m; $('#m-thesis').classList.toggle('on', m === 'thesis'); $('#m-data').classList.toggle('on', m === 'data'); $('#tnav').hidden = m !== 'thesis'; $('#qwrap').hidden = m !== 'data'; $('#nav').hidden = m !== 'data'; $('#thesis').hidden = m !== 'thesis'; $('#datahead').hidden = m !== 'data'; if (m === 'thesis') renderThesis(); }
$('#m-thesis').onclick = () => setMode('thesis'); $('#m-data').onclick = () => setMode('data');
$('#present').onclick = () => { document.body.classList.toggle('present'); $('#present').textContent = document.body.classList.contains('present') ? '退出演示' : '演示模式'; };
function gotoArt(a){ if (a.kind === 'column'){ const [tb, col] = a.ref.split('.'); setMode('data'); open(tb); setTab('dict'); const row = [...document.querySelectorAll('.dict tbody tr')].find(r => r.firstElementChild.textContent === col); if (row){ row.style.background = 'var(--sel)'; row.scrollIntoView({block:'center'}); } }
  else if (a.kind === 'table' || a.kind === 'view'){ setMode('data'); open(a.ref); setTab('data'); }
  else if (a.kind === 'rule'){ setMode('data'); open('calc_rule', a.ref); } else if (a.kind === 'assumption'){ setMode('data'); open('assumption', a.ref); } else if (a.kind === 'coefficient'){ setMode('data'); open('coefficient', a.ref); } else if (a.kind === 'migration'){ setMode('data'); open('migration_log', a.ref); } }
function renderThesis(){
  if (!curNode) curNode = TH.nodes[0].node_id;
  $('#tnav').innerHTML = TH.nodes.map(n => `<div class="node ${n.node_id===curNode?'on':''}" data-n="${n.node_id}"><div class="no">${n.seq}</div><div><b>${esc(n.title)}</b><div class="q">${esc(n.question)}</div></div></div>`).join('');
  document.querySelectorAll('.node').forEach(el => el.onclick = () => { curNode = el.dataset.n; renderThesis(); });
  const n = TH.nodes.find(x => x.node_id === curNode); const fs = forksOf(curNode);
  let h = `<div class="chain">` + TH.nodes.map((x, i) => `${i ? '<span class="ar">→</span>' : ''}<div class="cb ${x.node_id===curNode?'on':''}" data-n="${x.node_id}"><b>${x.seq}. ${esc(x.title)}</b><span>${forksOf(x.node_id).filter(f=>f.weight==='core').length} 个关键取舍</span></div>`).join('') + `</div>`;
  h += `<div class="concl"><div class="q">${esc(n.question)}</div><div class="c">${esc(n.conclusion)}</div><div class="r">思维链 ${esc(n.rings || '')} · 出处 ${esc(n.doc_refs || '')} · ${esc(n.owner)} ${esc(n.status)}</div></div>`;
  h += `<h3 style="margin:16px 0 6px;font-size:13px;color:var(--fg2)">关键决策分叉 · ${fs.filter(f=>f.weight==='core').length} 个核心 + ${fs.filter(f=>f.weight==='detail').length} 个细节（演示模式折叠）</h3>`;
  for (const f of fs){
    const arts = anchorsOf(f.fork_id);
    h += `<div class="fork ${f.weight}"><h4>${esc(f.fork_id)} · ${esc(f.question)}<span class="w">${f.weight==='core'?'核心':'细节'}</span><span class="w">${esc(f.log_ref||'')}</span></h4>
      <div>${f.options.map(o => `<span class="opt ${o===f.chosen?'on':''}">${esc(o)}</span>`).join('')}${f.options.includes(f.chosen)?'':`<span class="opt on">${esc(f.chosen)}</span>`}</div>
      <div class="why"><b>依据</b> ${esc(f.rationale)}</div>${f.before_after && f.before_after !== '—' ? `<div class="ba">改前 → 改后：${esc(f.before_after)}</div>` : ''}
      <div class="arts">${arts.length ? '<span class="art k">落到库里</span>' + arts.map((a, i) => `<span class="art" data-i="${TH.anchors.indexOf(a)}" title="${esc(a.how||'')}">${esc(a.ref)}</span>`).join('') : '<span class="art k">（无库内产物）</span>'}</div></div>`;
  }
  $('#thesis').innerHTML = h;
  document.querySelectorAll('.chain .cb').forEach(el => el.onclick = () => { curNode = el.dataset.n; renderThesis(); });
  document.querySelectorAll('.art[data-i]').forEach(el => el.onclick = () => gotoArt(TH.anchors[+el.dataset.i]));
}
$('#meta').innerHTML = `${esc(D.db)} · as-of ${D.as_of}<br>${D.n_records} 条登记记录（${D.n_visible} 可见）· ${D.migrations.length} 次改库 · ${D.n_changes} 条字段改动<br>生成 ${D.generated}`;
function nav(){
  const q = $('#q').value.trim().toLowerCase(); let h = '';
  for (const L of D.layers){
    const ts = L.tables.filter(t => !q || t.includes(q)); if (!ts.length) continue;
    h += `<div class="layer"><h4>${esc(L.name)}</h4><div class="ld">${esc(L.desc)}</div>` + ts.map(t => `<div class="tb ${t===cur?'on':''}" data-t="${t}"><span>${t}</span><span class="n">${(D.tables[t]||{}).n ?? '—'}</span></div>`).join('') + '</div>';
  }
  $('#nav').innerHTML = h; document.querySelectorAll('.tb').forEach(el => el.onclick = () => open(el.dataset.t));
}
function open(t, f){ cur = t; filter = f || ''; sort = {col:null, dir:1}; nav(); render(); if (f) setTab('data'); }
function setTab(x){ tab = x; document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === x)); for (const s of ['dict','data','rel','mig']) $('#'+s).hidden = s !== x; }
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
function cell(v){
  if (v === null || v === undefined || v === '') return '<td class="nul">∅</td>';
  const t = linkOf(v); const s = esc(v);
  if (t) return `<td class="k"><a class="id" href="#" data-t="${t}" data-v="${esc(v)}">${s}</a></td>`;
  return `<td title="${s}">${s}</td>`;
}
function render(){
  const T = D.tables[cur]; if (!T) return;
  $('#tname').textContent = cur; $('#tkind').textContent = T.kind === 'view' ? '视图（推导，不存值）' : '表'; $('#tn').textContent = `${T.n} 行 · ${T.cols.length} 列`; const tog = TH.origin[cur] || []; $('#tdesc').innerHTML = esc(T.desc || (T.error ? '视图报错：' + T.error : '')) + (tog.length ? '<div style="margin-top:4px">来自决策：' + tog.map(o => `<span class="anc" data-n="${o.node_id}" title="${esc(o.fork_question)} → ${esc(o.chosen)}">← ${o.node_id} ${esc(o.node_title)} · ${esc(o.fork_id)}</span>`).join('') + '</div>' : '');
  // 字典
  $('#dict').innerHTML = `<table class="dict"><thead><tr><th>列</th><th>类型</th><th>含义</th><th>设计出处</th><th>有值</th></tr></thead><tbody>` + T.cols.map(c => {
    const pct = T.n ? Math.round(100 * c.fill / T.n) : 0; const fill = c.derivable ? `<span class="muted">→ ${esc(c.view || '视图')}</span>` : `<span class="bar ${pct?'':'z'}"><i style="width:${pct}%"></i></span>${c.fill}/${T.n}`;
    const og = (TH.origin[cur + '.' + c.name] || []); const anc = og.map(o => `<span class="anc" data-n="${o.node_id}" title="${esc(o.fork_question)} → ${esc(o.chosen)}；${esc(o.how||'')}">← ${o.node_id} ${esc(o.node_title)} · ${esc(o.fork_id)}</span>`).join('');
    return `<tr><td>${esc(c.name)}${anc}</td><td class="t">${esc(c.type)}</td><td>${c.meaning ? esc(c.meaning) : '<span class="muted">（视图列，含义见来源表）</span>'}</td><td class="muted">${esc(c.ref || '')}</td><td>${fill}</td></tr>`; }).join('') + '</tbody></table>';
  // 数据
  let rows = T.rows.map((r, i) => [i, r]);
  if (filter){ const q = filter.toLowerCase(); rows = rows.filter(([i, r]) => r.some(v => v !== null && String(v).toLowerCase().includes(q))); }
  if (sort.col !== null){ const k = sort.col; rows.sort((a, b) => { const x = a[1][k], y = b[1][k]; if (x === y) return 0; if (x === null) return 1; if (y === null) return -1; return (x < y ? -1 : 1) * sort.dir; }); }
  $('#data').innerHTML = `<div class="tools"><input id="f" placeholder="过滤：任意列包含…" value="${esc(filter)}"><span>${rows.length} / ${T.n} 行</span><span class="muted">点表头排序 · 点 id 跳转 · 悬停看全文</span></div>
    <table class="data"><thead><tr>${T.cols.map((c, i) => `<th data-i="${i}" class="${sort.col===i?'sorted':''}">${esc(c.name)}${sort.col===i?(sort.dir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>` + rows.map(([i, r]) => '<tr>' + r.map(cell).join('') + '</tr>').join('') + '</tbody></table>';
  $('#f').oninput = e => { filter = e.target.value; render(); $('#f').focus(); $('#f').setSelectionRange(filter.length, filter.length); };
  document.querySelectorAll('.data th').forEach(th => th.onclick = () => { const i = +th.dataset.i; sort = sort.col === i ? {col: i, dir: -sort.dir} : {col: i, dir: 1}; render(); });
  document.querySelectorAll('a.id').forEach(a => a.onclick = ev => { ev.preventDefault(); open(a.dataset.t, a.dataset.v); });
  // 关系与规则
  const rel = D.relations.filter(r => r.from_table === cur || r.to_table.includes(cur));
  const rules = D.rules.filter(r => (r.inputs || '').includes(cur) || (r.output_view || '').includes(cur) || (r.formula || '').includes(cur));
  $('#rel').innerHTML = `<div class="grid2"><div class="card"><h4>表间关系（relation_doc）</h4>` + (rel.length ? `<table><thead><tr><th>从</th><th>列</th><th>到</th><th>列</th><th>基数</th><th>含义</th></tr></thead><tbody>` + rel.map(r => `<tr><td class="mono">${esc(r.from_table)}</td><td class="mono">${esc(r.from_col)}</td><td class="mono">${esc(r.to_table)}</td><td class="mono">${esc(r.to_col)}</td><td>${esc(r.card)}</td><td>${esc(r.meaning)}</td></tr>`).join('') + '</tbody></table>' : '<span class="muted">无</span>') +
    `</div><div class="card"><h4>计算规则（calc_rule，系数在 coefficient，挂假设台账）</h4>` + (rules.length ? rules.map(r => `<div style="margin:6px 0"><b class="mono">${esc(r.id)}</b> ${esc(r.name)}<span class="tag">${esc(r.assumptions || '')}</span><div class="mono muted">${esc(r.formula)}</div><div class="muted">输入 ${esc(r.inputs || '')} → ${esc(r.output_view || '')}；${esc(r.note || '')}</div></div>`).join('') : '<span class="muted">无</span>') + '</div></div>';
  // 改库账
  const cl = D.tables.change_log; const idx = Object.fromEntries(cl.cols.map((c, i) => [c.name, i]));
  const mine = cl.rows.filter(r => r[idx.table_name] === cur);
  $('#mig').innerHTML = `<div class="card"><h4>改库记录（migration_log）</h4><table><thead><tr><th>脚本</th><th>应用时间</th><th>checksum</th><th>owner</th><th>改动数</th><th>说明</th></tr></thead><tbody>` + D.migrations.map(m => `<tr><td class="mono">${esc(m.id)}</td><td>${esc(m.applied_at)}</td><td class="mono muted">${esc(m.checksum)}</td><td>${esc(m.owner)}</td><td>${m.n}</td><td>${esc(m.note)}</td></tr>`).join('') + '</tbody></table></div>' +
    `<div class="card"><h4>本表的字段级改动（change_log · ${mine.length} 条）</h4>` + (mine.length ? `<table class="data"><thead><tr>${cl.cols.map(c => `<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>` + mine.map(r => '<tr>' + r.map(cell).join('') + '</tr>').join('') + '</tbody></table>' : '<span class="muted">建库导入后无改动</span>') + '</div>';
  document.querySelectorAll('#mig a.id').forEach(a => a.onclick = ev => { ev.preventDefault(); open(a.dataset.t, a.dataset.v); });
  document.querySelectorAll('.anc').forEach(el => el.onclick = () => { curNode = el.dataset.n; setMode('thesis'); window.scrollTo(0,0); });
}
$('#q').oninput = nav;
$('#theme').onclick = () => { const r = document.documentElement; const d = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); r.setAttribute('data-theme', d ? 'light' : 'dark'); };
