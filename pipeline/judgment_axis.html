<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>判断层 · 判断轴原型</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--panel:#f6f7f9;--ink:#1f2329;--mut:#8a9099;--cap:#454b52;--line:#e6e8eb;--line2:#eff1f3;--accent:#3b5bdb;--accent-soft:#eef1fb;
--up:#1a7f45;--up-bg:#e3f4e9;--dn:#b3271e;--dn-bg:#fbe6e4;--shock:#b5730c;--shock-bg:#fbf0dd;--jud:#6b4bc4;--jud-soft:#f3effc}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{display:grid;grid-template-columns:212px 1fr;gap:12px;max-width:1240px;margin:0 auto;padding:14px}
.top{grid-column:1/3;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 14px;display:flex;align-items:baseline;gap:10px}
.top b{font-size:14px;color:var(--jud)}.top .q{color:var(--mut);font-size:11.5px}
.rail{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;align-self:start}
.rail .h{font-size:10px;font-weight:700;color:var(--jud);text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.grp{margin-bottom:12px}.glab{font-size:9.5px;color:var(--mut);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.it{display:flex;justify-content:space-between;align-items:center;padding:4px 7px;border-radius:6px;font-size:11.5px;color:var(--cap);cursor:pointer}
.it:hover{background:var(--panel)}.it.on{background:var(--jud);color:#fff;font-weight:700}.it.on .c{color:#d9cff2}
.it .c{color:var(--mut);font-size:10px}.it.dis{color:#b3b8bf;cursor:default}
.tab{display:inline-block;border:1px solid var(--line);border-radius:11px;padding:1px 8px;font-size:10px;margin:0 3px 3px 0;color:var(--cap);background:#fff}
.rnote{font-size:9px;color:var(--mut);line-height:1.45;margin-top:6px;border-top:1px dashed var(--line);padding-top:7px}
.main{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;align-self:start}
.dist{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--cap)}.dist b{color:var(--ink)}
.cap{font-size:11px;color:var(--mut);margin-bottom:5px}.cap b{color:var(--ink)}
table.d{width:100%;border-collapse:collapse;font-size:11px}
table.d th{text-align:left;color:var(--mut);font-weight:600;font-size:9.5px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);background:#fafbfc}
table.d th.r,table.d td.r{text-align:right;font-variant-numeric:tabular-nums}
table.d td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover{background:#faf7ff}tr.click.sel{background:var(--jud-soft)}
.ek{font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap}
.ek.rule{background:var(--up-bg);color:var(--up)}.ek.human{background:#f3f4f6;color:var(--cap)}.ek.llm{background:var(--jud-soft);color:var(--jud)}.ek.model{background:var(--accent-soft);color:var(--accent)}
.ladder{display:inline-flex;align-items:center;gap:2px}
.ladder .st{font-size:9px;padding:1px 5px;border-radius:4px;background:#f3f4f6;color:#b3b8bf}
.ladder .st.past{background:#e8eaed;color:var(--mut)}.ladder .st.cur{background:var(--jud);color:#fff;font-weight:700}.ladder .arw{color:#c4c9cf;font-size:8px}
.pl{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:9.5px;color:var(--mut);font-weight:600}
.muted{color:var(--mut)}.note{color:var(--mut);font-size:10.5px;margin-top:8px;line-height:1.5}
.drill{border:1px solid var(--jud);border-radius:8px;margin-top:10px;background:#fdfcff;padding:10px 12px}
.dh2{font-size:11.5px;font-weight:700;color:var(--jud);margin-bottom:6px}
.link{color:var(--jud);cursor:pointer;text-decoration:underline;font-size:10px}
/* LLM mode */
.banner{background:#fff8e8;border:1px dashed #e9d09a;color:#8a5a08;border-radius:7px;padding:8px 12px;font-size:11.5px;margin-bottom:12px}
.hstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbfcfd}
.kpi .l{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.02em}
.kpi .v{font-size:19px;font-weight:800;margin-top:2px}.kpi .v small{font-size:11px;font-weight:600}
.kpi.warn{background:var(--shock-bg);border-color:#efdcae}.kpi.warn .v{color:var(--shock)}
.kpi.bad .v{color:var(--dn)}
.qcard{border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.qh{padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;color:var(--cap);background:#fafbfc}
.qi{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:11.5px}
.qi:last-child{border-bottom:0}.qi:hover{background:#fafbff}
.sev{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap}
.sev.high{background:var(--dn-bg);color:var(--dn)}.sev.mid{background:var(--shock-bg);color:var(--shock)}.sev.act{background:var(--accent-soft);color:var(--accent)}
.qi .txt{flex:1;color:var(--ink)}.qi .go{color:var(--jud);cursor:pointer;font-size:10.5px;text-decoration:underline;white-space:nowrap}
.evb{display:inline-flex;gap:5px}.evb .e{border-radius:4px;padding:0 6px;font-size:10px;font-weight:700}
.e.g{background:var(--up-bg);color:var(--up)}.e.a{background:var(--shock-bg);color:var(--shock)}.e.r{background:var(--dn-bg);color:var(--dn)}
.drawer{border:1px solid var(--jud);border-radius:8px;margin-top:10px;background:#fdfcff}
.drawer .dh{padding:8px 12px;border-bottom:1px solid #eee6f7;font-size:11px;font-weight:700;color:var(--jud);display:flex;justify-content:space-between;align-items:center}
.drawer .db{padding:10px 12px;font-size:11px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 8px;margin-bottom:8px}.kv .k{color:var(--mut);font-size:10px}.kv .v{font-family:ui-monospace,monospace;font-size:10.5px}
.lfbtn{display:inline-block;background:var(--jud);color:#fff;border-radius:6px;padding:4px 10px;font-size:10.5px;font-weight:600;cursor:pointer;text-decoration:none}
</style></head><body>
<div class="app">

   {dec:'lf_0410',target:'stg_observation r166',anchor:'循环融资 shock',choice:'草稿:NVIDIA 循环融资=regime,方向不下注',conf:0.58,ev:['r:rubric 0.58','r:幻觉 疑','r:vs人标 分歧'],trace:'lf_tr_2a91',esc:true},
   {dec:'lf_0409',target:'stg_observation r158',anchor:'cost/token 涨价 shock',choice:'草稿:引用 2027-01 涨价公告(核验:公告不存在)',conf:0.40,ev:['r:rubric 0.40','r:幻觉 是','r:vs人标 分歧'],trace:'lf_tr_2a70',esc:true},
  ],
 }
};
const LF_HOST='https://cloud.langfuse.com';
function lfTraceUrl(id){return LF_HOST+'/trace/'+encodeURIComponent(id)}
let mode='all', curType=null;

const EK={rule:['规则/code','rule'],human:['人 A–D','human'],llm:['LLM','llm'],model:['模型','model']};
function ekBadge(k){const e=EK[k]||['?','human'];return `<span class="ek ${e[1]}">${e[0]}</span>`;}
function ladder(cur){const s=['human','shadow','assisted','auto'],lab={human:'人',shadow:'影子',assisted:'辅助',auto:'自动'},ci=s.indexOf(cur);
 return `<span class="ladder">`+s.map((x,i)=>`<span class="st ${i<ci?'past':''} ${i===ci?'cur':''}">${lab[x]}</span>`+(i<3?'<span class="arw">›</span>':'')).join('')+`</span>`;}
function evChip(s){const c=s[0],t=s.slice(2);return t==='—'?'':`<span class="e ${c}">${t}</span>`;}

function renderRail(){
 const TG={'表征/源':1,'边':3,'闸':2,'regime/方向':3,'运维':3};
 let tier={};J.registry.forEach(r=>tier[r.tier||'—']=(tier[r.tier||'—']||0)+1);
 const EKS=[['all','全部',12],['rule','规则/code',J.dist_executor.rule||0],['human','人',J.dist_executor.human||0],['llm','LLM',J.dist_executor.llm||0],['model','模型',J.dist_executor.model||0]];
 let h=`<div class="h">判断轴 · 筛选</div><div class="grp"><div class="glab">执行主体(单选·驱动视图)</div>`;
 EKS.forEach(([k,l,n])=>{const dis=(k==='model');h+=`<div class="it ${mode===k?'on':''} ${dis?'dis':''}" ${dis?'':`onclick="setMode('${k}')"`}><span>${l}${k==='llm'?' <span class="pl" style="border-color:#e9d09a;color:#8a5a08">示意</span>':''}</span><span class="c">${n}${(k==='llm'&&n===0)?'·未启用':''}</span></div>`;});
 h+=`</div><div class="grp"><div class="glab">成熟度</div>`+[['human','人',J.dist_calib.human||0],['shadow','影子',J.dist_calib.shadow||0],['assisted','辅助',J.dist_calib.assisted||0],['auto','自动',J.dist_calib.auto||0]].map(x=>`<div class="it"><span><span style="color:#b3b8bf">☐</span> ${x[1]}</span><span class="c">${x[2]}</span></div>`).join('')+`</div>`;
 h+=`<div class="grp"><div class="glab">研究档</div>`+['A','B','C','—'].map(t=>`<span class="tab">${t} ${tier[t]||0}</span>`).join('')+`</div>`;
 h+=`<div class="grp"><div class="glab">判断类型分组</div>`+Object.entries(TG).map(([g,n])=>`<div class="it"><span><span style="color:#b3b8bf">☐</span> ${g}</span><span class="c">${n}</span></div>`).join('')+`</div>`;
 h+=`<div class="rnote">执行主体=单选,驱动主区:全部/规则/人=登记表+实例下钻;<b>LLM=切到监控模式</b>(概览+紧急队列+trace)。其余为筛选维度。不含票/D1–D7(那是结果轴)。</div>`;
 document.getElementById('rail').innerHTML=h;
}
function setMode(m){mode=m;curType=null;renderRail();renderMain();}

// ===== 非 LLM:登记表 + 下钻 =====
function renderReg(){
 const rows=J.registry.filter(r=>mode==='all'||r.ek===mode);
 if(mode==='model'){document.getElementById('main').innerHTML='<div class="muted" style="padding:10px">模型执行主体:0 · 未启用(有基率、可回测的窄预测上线后在此)。</div>';return;}
 let h=`<div class="dist"><span>共 <b>${rows.length}</b> 类判断</span><span>决策日志 <b>${J.log_total}</b> 条 · outcome 回填 <b style="color:var(--dn)">${J.log_outcome}/${J.log_total}</b></span></div>`;
 h+=`<div class="cap"><b>判断登记表</b> · 点某类型 → 下方展开它的实例(六元组)</div>`;
 h+=`<table class="d"><thead><tr><th>判断类型</th><th>执行主体</th><th>成熟度</th><th>档</th><th class="r">记录</th><th class="r">outcome</th></tr></thead><tbody>`;
 rows.forEach(r=>{const ag=J.logagg[r.id]||{n:0,outcome:0};
   h+=`<tr class="click ${curType===r.id?'sel':''}" onclick="setType('${r.id}')"><td style="font-weight:600">${r.name||r.id}<div class="muted" style="font-size:9px">${r.id} · 点看实例 ▾</div></td><td>${ekBadge(r.ek)}</td><td>${ladder(r.calib)}</td><td><span class="pl">${r.tier||'—'}</span></td><td class="r">${ag.n}</td><td class="r" style="color:${ag.outcome?'var(--up)':'var(--mut)'}">${ag.outcome}</td></tr>`;});
 h+=`</tbody></table><div id="drill"></div>`;
 document.getElementById('main').innerHTML=h;
 if(curType)renderDrill(curType);
}
function setType(id){curType=id;if(mode==='llm')renderLLMDrill(id);else renderReg();}
function renderDrill(id){
 const reg=J.registry.find(r=>r.id===id),ins=(J.instances||{})[id]||[],ag=J.logagg[id]||{n:0,outcome:0};
 let h=`<div class="drill"><div class="dh2">下钻 · ${reg.name} · ${ekBadge(reg.ek)} · ${ladder(reg.calib)} · 实例 ${ag.n} · outcome ${ag.outcome}/${ag.n}</div>`;
 if(!ins.length){h+=`<div class="muted">暂无实例</div></div>`;}
 else{h+=`<table class="d"><thead><tr><th>实例</th><th>判的对象</th><th>choice</th><th class="r">置信</th><th>依据</th><th>outcome</th></tr></thead><tbody>`+
   ins.map(x=>`<tr><td class="muted" style="font-size:9px">${x.dec}</td><td style="font-size:10.5px">${x.target||'—'}</td><td style="font-size:10.5px">${x.choice||'—'}</td><td class="r">${x.conf==null?'—':x.conf}</td><td class="muted" style="font-size:10px">${x.basis||'—'}</td><td style="color:${x.outcome?'var(--up)':'var(--mut)'};font-size:10px">${x.outcome||'待回填'}</td></tr>`).join('')+
   `</tbody></table><div class="note">点单条 → 溯源(state_anchor 原文 / candidate_pool 候选)。执行=人,故看 basis;若=LLM 则出 Langfuse trace。</div>`;}
 h+=`</div>`;
 const d=document.getElementById('drill');if(d)d.innerHTML=h;
}

// ===== LLM 监控模式 =====
function renderLLM(){
 const H=LLM.health;
 let h=`<div class="banner">⚑ 当前库中 LLM 判断 = <b>0(未启用)</b>。以下为 <b>LLM 上线后示意</b>,展示监控模式该长什么样;真数据接入后自动替换。计划迁 LLM:源分类五元组 / 主题聚类 / 证伪闸 stance / 背离解释初稿。</div>`;
 // 高度1 健康概览条
 h+=`<div class="cap"><b>① LLM 健康概览</b>(overall 监控 · 只放重点,不放原始 trace)</div><div class="hstrip">
  <div class="kpi ${H.esc>0.1?'warn':''}"><div class="l">逃逸率 ${H.esc_t}</div><div class="v">${(H.esc*100).toFixed(0)}<small>%</small></div></div>
  <div class="kpi"><div class="l">eval 均分 ${H.eval_t}</div><div class="v">${H.eval}</div></div>
  <div class="kpi ${H.halluc>0?'bad':''}"><div class="l">幻觉旗标</div><div class="v">${H.halluc}</div></div>
  <div class="kpi"><div class="l">成本/量</div><div class="v" style="font-size:14px">${H.cost}<br><small class="muted">${H.calls} 调用</small></div></div>
  <div class="kpi ${H.todo?'warn':''}"><div class="l">待处理</div><div class="v">${H.todo}</div></div>
  <div class="kpi"><div class="l">成熟度</div><div class="v" style="font-size:13px">影子 ${H.shadow}<br>辅助 ${H.assisted}</div></div></div>`;
 // 高度2 紧急队列
 h+=`<div class="qcard"><div class="qh">② 紧急队列 · 我现在要处理什么</div>`+
   LLM.queue.map((q,i)=>`<div class="qi"><span class="sev ${q.sev}">${q.kind}</span><span class="txt">${q.txt}</span><span class="go" onclick="openQ(${i})">${q.sev==='act'?'去审批 ›':'看 trace ›'}</span></div>`).join('')+`</div>`;
 // LLM 类型表
 h+=`<div class="cap"><b>③ LLM 判断类型</b> · 点某类型 → 实例(带 eval)</div>
   <table class="d"><thead><tr><th>类型</th><th>算子</th><th>成熟度</th><th class="r">eval</th><th class="r">逃逸率</th><th class="r">记录</th><th>prompt 版本</th></tr></thead><tbody>`+
   LLM.types.map(t=>`<tr class="click ${curType===t.id?'sel':''}" onclick="setType('${t.id}')"><td style="font-weight:600">${t.name}</td><td><span class="pl">${t.op}</span></td><td>${ladder(t.calib)}</td>
     <td class="r"><span class="e ${t.eval>=0.85?'g':t.eval>=0.7?'a':'r'}" style="padding:0 5px;border-radius:4px;font-weight:700">${t.eval}</span></td>
     <td class="r" style="color:${t.esc>0.15?'var(--dn)':'var(--cap)'}">${(t.esc*100).toFixed(0)}%</td><td class="r">${t.n}</td><td class="muted" style="font-size:10px">${t.prompt}</td></tr>`).join('')+
   `</tbody></table><div id="drill"></div>`;
 document.getElementById('main').innerHTML=h;
 if(curType)renderLLMDrill(curType);
}
function renderLLMDrill(id){
 const t=LLM.types.find(x=>x.id===id),ins=LLM.inst[id]||[];
 let h=`<div class="drill"><div class="dh2">下钻 · ${t.name} · ${ladder(t.calib)} · eval ${t.eval} · 逃逸 ${(t.esc*100).toFixed(0)}% · prompt ${t.prompt}</div>`;
 h+=`<table class="d"><thead><tr><th>实例</th><th>判的对象</th><th>choice</th><th class="r">置信</th><th>eval(Langfuse)</th><th>trace</th></tr></thead><tbody>`+
   ins.map((x,i)=>`<tr class="click" onclick="openTrace('${id}',${i})"><td class="muted" style="font-size:9px">${x.dec}</td><td style="font-size:10.5px">${x.target}</td><td style="font-size:10.5px">${x.choice}${x.esc?' <span class="sev high" style="padding:0 5px">逃逸</span>':''}</td><td class="r">${x.conf}</td><td><span class="evb">${x.ev.map(evChip).join('')}</span></td><td><span class="link">⋯trace</span></td></tr>`).join('')+
   `</tbody></table><div id="tdraw"></div><div class="note">③ 单实例点开 → trace 摘要(下)。全量 span 瀑布/replay 在 Langfuse,靠 trace_id 深链跳,不在此重建。</div></div>`;
 document.getElementById('main');const d=document.getElementById('drill');if(d)d.innerHTML=h;
}
function openTrace(id,i){
 const x=LLM.inst[id][i],t=LLM.types.find(y=>y.id===id);
 let h=`<div class="drawer"><div class="dh"><span>trace 摘要 · ${x.dec} ${x.esc?'· <span class="sev high" style="padding:0 6px">已逃逸人工</span>':''}</span><a class="lfbtn" href="${lfTraceUrl(x.trace)}" target="_blank" rel="noopener">在 Langfuse 打开 ↗</a></div>
  <div class="db"><div class="kv">
   <div class="k">trace_id</div><div class="v">${x.trace} <span class="muted">(→ decision_log.trace_id)</span></div>
   <div class="k">model / prompt</div><div class="v">claude-* / ${t.prompt}</div>
   <div class="k">input(anchor)</div><div class="v">${x.anchor}</div>
   <div class="k">output(判断)</div><div class="v">${x.choice}</div></div>
   <div class="cap" style="margin:0 0 3px">eval(Langfuse score → 记分卡)</div><div class="evb">${x.ev.map(evChip).join('')}</div>
   <div class="note">此处只放"辅助你判断这条可不可信"的摘要:input/output/eval/逃逸态 + 深链。逐 token、latency、span、prompt playground → 点上方跳 Langfuse。</div></div></div>`;
 const d=document.getElementById('tdraw');if(d)d.innerHTML=h;
}
function openQ(i){const q=LLM.queue[i];setType(q.type);setTimeout(()=>{const el=document.getElementById('drill');if(el)el.scrollIntoView({behavior:'smooth'});},30);}

function renderMain(){if(mode==='llm')renderLLM();else renderReg();}
renderRail();renderMain();
</script></body></html>
